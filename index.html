<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Opening Lab</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20viewBox%3D%220%200%20100%20100%22%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%3E%3Cdefs%3E%3CclipPath%20id%3D%22r3c3c3c%22%3E%3Crect%20x%3D%2250%22%20y%3D%220%22%20width%3D%2250%22%20height%3D%22100%22/%3E%3C/clipPath%3E%3C/defs%3E%3Crect%20width%3D%22100%22%20height%3D%22100%22%20rx%3D%2222%22%20fill%3D%22%23f4f4f2%22/%3E%3Cg%20transform%3D%22translate%286%205%29%20scale%28.88%29%22%3E%3Cg%20fill%3D%22%23161616%22%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2225%22%20r%3D%2213%22/%3E%3Crect%20x%3D%2233%22%20y%3D%2238.5%22%20width%3D%2234%22%20height%3D%227%22%20rx%3D%223.5%22/%3E%3Cpath%20d%3D%22M40.5%2045.5%20C40.5%2060%2034%2069%2026.5%2078%20L73.5%2078%20C66%2069%2059.5%2060%2059.5%2045.5%20Z%22/%3E%3Crect%20x%3D%2221%22%20y%3D%2278%22%20width%3D%2258%22%20height%3D%2210%22%20rx%3D%225%22/%3E%3C/g%3E%3Cg%20fill%3D%22%233c3c3c%22%20clip-path%3D%22url%28%23r3c3c3c%29%22%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2225%22%20r%3D%2213%22/%3E%3Crect%20x%3D%2233%22%20y%3D%2238.5%22%20width%3D%2234%22%20height%3D%227%22%20rx%3D%223.5%22/%3E%3Cpath%20d%3D%22M40.5%2045.5%20C40.5%2060%2034%2069%2026.5%2078%20L73.5%2078%20C66%2069%2059.5%2060%2059.5%2045.5%20Z%22/%3E%3Crect%20x%3D%2221%22%20y%3D%2278%22%20width%3D%2258%22%20height%3D%2210%22%20rx%3D%225%22/%3E%3C/g%3E%3Cellipse%20cx%3D%2245%22%20cy%3D%2220%22%20rx%3D%224.5%22%20ry%3D%223%22%20fill%3D%22%235a5a5a%22%20opacity%3D%22.9%22%20transform%3D%22rotate%28-35%2045%2020%29%22/%3E%3C/g%3E%3C/svg%3E">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: dark sidebar | board with player bars | tabbed study panel. Single dark look, like a chess server's analysis room. */
:root{
  --bg:#312e2b; --side:#262421; --panel:#262522; --panel2:#1f1e1b; --row:#2b2926; --rowh:#3a3733;
  --line:#3c3a37; --fg:#ffffff; --fg2:#c3c2c1; --fg3:#8b8987;
  --green:#81b64c; --green-d:#45753c; --green-h:#95c45f;
  --sq-l:#ebecd0; --sq-d:#739552; --hl:rgba(255,255,51,.5); --sel:rgba(255,255,51,.5);
  --book:#a88865; --good:#81b64c; --bad:#fa412d; --arrow:rgba(255,170,0,.85);
  --gold:#f7c045;
  --ui:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:14px;margin:0;overflow:hidden}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,.item:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.app{display:flex;height:100%}

/* Sidebar */
.sidebar{width:168px;flex:none;background:var(--side);display:flex;flex-direction:column;padding:10px 0;gap:2px}
.brand{display:flex;align-items:center;gap:8px;padding:8px 14px 16px;font-weight:800;font-size:19px;letter-spacing:-.3px}
.brand svg{width:30px;height:30px;flex:none}
.brand b{color:var(--green)}
.nav{display:flex;align-items:center;gap:12px;padding:10px 14px;font-weight:700;font-size:15px;color:var(--fg2);width:100%;text-align:left}
.nav svg{width:26px;height:26px;flex:none}
.nav:hover{background:#1c1b19;color:var(--fg)}
.nav.on{color:var(--fg);background:#1c1b19}
.nav .cnt{margin-left:auto;font-size:11px;color:var(--fg3);font-weight:600}
.side-foot{margin-top:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.toggle{display:flex;align-items:center;gap:8px;color:var(--fg3);font-size:12px;font-weight:600}
.toggle input{accent-color:var(--green)}
.prog{font-size:12px;color:var(--fg3)}
.dl{display:block;text-align:center;font-size:12px;font-weight:700;color:var(--fg);background:#3c3a37;border-radius:5px;padding:8px;text-decoration:none}
.dl:hover{background:#4a4744}
.bar{height:6px;background:#3d3a36;border-radius:3px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--green);width:0;transition:width .3s}

/* Main */
.main{flex:1;min-width:0;display:flex;justify-content:center;align-items:flex-start;gap:20px;padding:16px 20px;overflow:auto}
.boardcol{display:flex;flex-direction:column;gap:6px;width:var(--bs)}
.boardcol{--bs:clamp(300px,min(calc(100vh - 132px),calc(100vw - 168px - 420px - 80px)),900px)}
.player{display:flex;align-items:center;gap:10px;height:40px}
.avatar{width:36px;height:36px;border-radius:3px;display:grid;place-items:center;background:#4b4847;flex:none;overflow:hidden}
.avatar img{width:30px;height:30px}
.pname{font-weight:700;font-size:14px}
.ptag{font-size:12px;color:var(--fg3);font-weight:500;margin-left:6px}
.clock{margin-left:auto;background:#3c3a37;color:var(--fg3);font-weight:700;font-size:13px;padding:7px 12px;border-radius:3px;min-width:92px;text-align:center}
.clock.on{background:#fff;color:#262421}
.board{position:relative;width:var(--bs);height:var(--bs);border-radius:3px;overflow:hidden;user-select:none;touch-action:none;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.sqs{position:absolute;inset:0;display:grid;grid-template:repeat(8,1fr)/repeat(8,1fr)}
.sq{position:relative}
.sq.l{background:var(--sq-l)} .sq.d{background:var(--sq-d)}
.sq.hl::before,.sq.sel::before{content:"";position:absolute;inset:0;background:var(--hl)}
.sq.chk::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 52%,rgba(120,0,0,1) 0%,rgba(115,0,0,.95) 25%,rgba(100,0,0,.55) 45%,rgba(90,0,0,0) 66%)}
.pc.shake{animation:mateShake .6s cubic-bezier(.36,.07,.19,.97) .28s both}
@keyframes mateShake{0%,100%{transform:rotate(0)}15%{transform:rotate(-9deg)}30%{transform:rotate(8deg)}45%{transform:rotate(-6deg)}60%{transform:rotate(4deg)}75%{transform:rotate(-2deg)}}
.badge.big{width:5.4%;height:5.4%;font:800 calc(var(--bs)/34)/1 var(--ui);color:#fff}
.badge.fresh{animation:pop .35s cubic-bezier(.3,1.6,.5,1) .35s both}
.mate-card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.85);z-index:8;background:rgba(38,36,33,.94);border-radius:10px;padding:18px 26px;text-align:center;
  box-shadow:0 10px 40px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .35s ease,transform .45s cubic-bezier(.3,1.5,.5,1)}
.mate-card.on{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto;cursor:pointer}
.mate-card .t{font-size:calc(var(--bs)/16);font-weight:800;letter-spacing:-.5px;color:#fff}
.mate-card .s{margin-top:4px;font-size:calc(var(--bs)/34);font-weight:700;color:var(--fg2)}
.mate-card .crown{width:calc(var(--bs)/9);height:calc(var(--bs)/9);margin:0 auto 8px;border-radius:50%;background:var(--green);display:grid;place-items:center;box-shadow:0 3px 0 var(--green-d)}
.mate-card .crown svg{width:62%;height:62%}
.sq.pre::before{content:"";position:absolute;inset:0;background:rgba(214,48,48,.6)}
.sq.wrong::before{content:"";position:absolute;inset:0;background:rgba(250,65,45,.45)}
.sq.dot::after{content:"";position:absolute;left:50%;top:50%;width:30%;height:30%;transform:translate(-50%,-50%);border-radius:50%;background:rgba(0,0,0,.14)}
.sq.ring::after{content:"";position:absolute;inset:0;border-radius:50%;border:calc(var(--bs)/100) solid rgba(0,0,0,.14)}
.co{position:absolute;font-weight:700;font-size:calc(var(--bs)/52);line-height:1;pointer-events:none}
.co.r{left:4%;top:4%} .co.f{right:5%;bottom:4%}
.sq.l .co{color:var(--sq-d)} .sq.d .co{color:var(--sq-l)}
.pcs{position:absolute;inset:0;pointer-events:none}
.pc{position:absolute;width:12.5%;height:12.5%;background-size:100%;will-change:transform}
.pc.drag{z-index:5;transition:none!important}
.pc.ghost{opacity:.35}
.badge{position:absolute;width:4.6%;height:4.6%;border-radius:50%;z-index:6;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.45);pointer-events:none;animation:pop .2s ease-out}
.badge svg{width:70%;height:70%}
@keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}
.arrows{position:absolute;inset:0;pointer-events:none;z-index:4}
.promo-note{display:none}

/* Panel */
.panel{width:420px;flex:none;background:var(--panel);border-radius:6px;display:flex;flex-direction:column;height:calc(var(--bs) + 92px);max-height:calc(100vh - 32px);min-height:520px;overflow:hidden}
.tabs{display:flex;background:var(--panel2);flex:none}
.tab{flex:1;padding:12px 6px 10px;font-weight:700;font-size:13px;color:var(--fg3);display:flex;flex-direction:column;align-items:center;gap:4px;border-bottom:3px solid transparent}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--fg);background:var(--panel);border-bottom-color:transparent}
.tab:hover{color:var(--fg)}
.view{flex:1;min-height:0;display:flex;flex-direction:column}
.view[hidden]{display:none!important}

/* Library */
.filters{padding:12px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.seg{display:flex;background:var(--panel2);border-radius:5px;padding:3px;gap:3px}
.seg button{flex:1;padding:7px 4px;border-radius:4px;font-weight:700;font-size:13px;color:var(--fg3);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:#45423e;color:var(--fg)}
.seg img{width:18px;height:18px}
.search{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:0 10px}
.search svg{width:16px;height:16px;color:var(--fg3);flex:none}
.search input{flex:1;min-width:0;background:none;border:0;color:var(--fg);padding:9px 0;font:inherit;outline:none}
.list{flex:1;overflow:auto;padding-bottom:10px}
.grp{padding:12px 14px 6px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--fg3)}
.item{display:flex;align-items:center;gap:12px;padding:10px 14px;cursor:pointer;width:100%;text-align:left}
.item:hover{background:var(--rowh)}
.item.cur{background:#3f4a35}
.item .ic{width:34px;height:34px;border-radius:4px;flex:none;display:grid;place-items:center}
.item .ic.w{background:#e9e8e3} .item .ic.b{background:#1a1917;border:1px solid #4a4744}
.item .ic img{width:28px;height:28px}
.item .tx{flex:1;min-width:0}
.item .nm{font-weight:700;font-size:14px;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .pv{font-size:12px;color:var(--fg3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;font-variant-numeric:tabular-nums}
.item .eco{font-size:11px;font-weight:700;color:var(--fg3);background:var(--panel2);border-radius:3px;padding:2px 6px;flex:none}
.item .ok{width:20px;height:20px;flex:none;border-radius:50%;background:var(--green);display:grid;place-items:center}
.item .ok svg{width:12px;height:12px}
.item .ok.no{background:none;border:2px solid #4a4744}
.empty{padding:30px 16px;color:var(--fg3);text-align:center}
.famhead .chev{width:18px;height:18px;flex:none;color:var(--fg3);transition:transform .2s}
.fam.open .famhead .chev{transform:rotate(90deg)}
.fam .subs{display:none}
.fam.open .subs{display:block;background:#22211e;border-bottom:1px solid var(--line)}
.item.sub{padding:8px 14px 8px 22px;gap:10px}
.item.sub .nm{font-size:13px}
.tree{width:22px;height:22px;flex:none;border-left:2px solid #4a4744;border-bottom:2px solid #4a4744;border-bottom-left-radius:7px;margin:-14px 0 0 10px}
.maintag{font-size:10px;font-weight:800;background:#33402a;color:#c5e3a4;border-radius:3px;padding:1px 5px;margin-left:6px;vertical-align:1px}
.vars{display:flex;flex-wrap:wrap;gap:6px}
.vars button{font-size:12px;font-weight:700;padding:5px 10px;border-radius:14px;background:var(--panel2);color:var(--fg2);border:1px solid var(--line)}
.vars button:hover{color:var(--fg);border-color:#5b5855}
.vars button.on{background:#3f4a35;color:var(--fg);border-color:#5d7a3f}
.vars .ck{color:var(--green);margin-left:5px}
.varsel{width:100%;background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:5px;padding:8px 10px;font:600 13px var(--ui)}
#l-side button{font-size:12px;padding:6px 4px}
#l-side img{width:16px;height:16px}

/* Line view */
.lhead{padding:14px 14px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.lhead h2{margin:0;font-size:18px;line-height:1.25;text-wrap:balance}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{font-size:11px;font-weight:700;padding:3px 7px;border-radius:3px;background:var(--panel2);color:var(--fg2)}
.chip.trap{background:#5c2b24;color:#ffb3a8}
.chip.op{background:#33402a;color:#c5e3a4}
.desc{font-size:13px;color:var(--fg2);line-height:1.5;margin:0}
.modes{display:flex;gap:6px}
.modes button{flex:1;padding:8px;border-radius:5px;font-weight:700;font-size:13px;background:var(--panel2);color:var(--fg3)}
.modes button.on{background:#45423e;color:var(--fg)}
.coach{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:flex-start;min-height:86px}
.coach .face{width:42px;height:42px;border-radius:50%;background:#3d3a36;flex:none;display:grid;place-items:center}
.coach .face svg{width:30px;height:30px}
.bubble{position:relative;background:#fff;color:#312e2b;border-radius:8px;padding:9px 12px;font-size:13.5px;line-height:1.45;flex:1;min-width:0}
.bubble::before{content:"";position:absolute;left:-7px;top:14px;border:7px solid transparent;border-left:0;border-right-color:#fff}
.bubble b{font-weight:800}
.bubble .mv{font-family:var(--mono);font-weight:700}
.bubble.good{box-shadow:inset 4px 0 0 var(--good)}
.bubble.bad{box-shadow:inset 4px 0 0 var(--bad)}
.bubble.book{box-shadow:inset 4px 0 0 var(--book)}
.moves{flex:1;overflow:auto;font-variant-numeric:tabular-nums}
.mrow{display:grid;grid-template-columns:44px 1fr 1fr;align-items:center;font-size:14px}
.mrow:nth-child(odd){background:var(--row)}
.mrow .n{color:var(--fg3);padding:6px 0 6px 14px;font-weight:600}
.mrow .m{padding:5px 8px;margin:1px 4px;border-radius:3px;font-weight:700;color:var(--fg2);cursor:pointer;display:flex;align-items:center;gap:5px}
.mrow .m:hover{background:#45423e}
.mrow .m.cur{background:#4b4847;color:var(--fg);border-bottom:2px solid #6b6866}
.mrow .m.off{font-style:italic;color:#d7a24a}
.mrow .m.hid{color:transparent;cursor:default;pointer-events:none}
.mrow .m.hid::after{content:"···";color:var(--fg3)}
.mrow .m .cdot{width:5px;height:5px;border-radius:50%;background:var(--book);flex:none}
.done{margin:12px 14px;padding:14px;border-radius:6px;background:#2f3b27;display:flex;flex-direction:column;gap:10px}
.done h3{margin:0;font-size:16px}
.done p{margin:0;color:var(--fg2);font-size:13px}
.ctrl{flex:none;display:flex;gap:4px;padding:8px 10px;background:var(--panel2)}
.ctrl button{flex:1;height:40px;border-radius:4px;background:#3c3a37;display:grid;place-items:center;color:var(--fg2)}
.ctrl button:hover{background:#4a4744;color:var(--fg)}
.ctrl button:disabled{opacity:.4;cursor:default}
.ctrl svg{width:20px;height:20px}
.actions{flex:none;display:flex;gap:8px;padding:10px 12px 12px;background:var(--panel2)}
.btn{flex:1;padding:12px 10px;border-radius:7px;font-weight:800;font-size:15px;background:#45423e;color:var(--fg);box-shadow:0 4px 0 #2b2926;transition:transform .05s}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #2b2926}
.btn.go{background:var(--green);box-shadow:0 4px 0 var(--green-d);text-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn.go:hover{background:var(--green-h)}
.btn.go:active{box-shadow:0 2px 0 var(--green-d)}
.credit{font-size:10.5px;color:#6f6d6a;padding:0 14px 8px;background:var(--panel2)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:#1c1b19;color:var(--fg);padding:10px 16px;border-radius:6px;font-weight:700;opacity:0;transition:.2s;pointer-events:none;z-index:50;box-shadow:0 4px 18px rgba(0,0,0,.4)}
.toast.on{opacity:1;transform:translateX(-50%)}

/* Phone / tablet */
@media (max-width:960px){
  body{overflow:auto}
  .app{flex-direction:column;height:auto;min-height:100%}
  .sidebar{width:auto;flex-direction:row;align-items:center;padding:6px max(10px,env(safe-area-inset-right,0px)) 6px max(10px,env(safe-area-inset-left,0px));overflow-x:auto;gap:0}
  .brand{padding:4px 10px 4px 0;font-size:16px}
  .brand svg{width:24px;height:24px}
  .nav{width:auto;padding:8px 10px;font-size:13px;gap:6px;white-space:nowrap}
  .nav svg{width:20px;height:20px}
  .nav .cnt{display:none}
  .side-foot{display:none}
  .main{flex-direction:column;align-items:stretch;padding-block:10px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:visible}
  .boardcol{--bs:min(calc(100vw - 32px),620px);margin:0 auto}
  .panel{width:100%;max-width:620px;margin:0 auto;height:auto;max-height:none;min-height:0}
  .list{max-height:60vh}
  .moves{max-height:240px}
  .clock{min-width:70px;font-size:14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head><body>

      <svg aria-hidden="true" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><defs><clipPath id="r3c3c3c"><rect x="50" y="0" width="50" height="100"/></clipPath></defs>

<path d="M40.5 45.5 C40.5 60 34 69 26.5 78 L73.5 78 C66 69 59.5 60 59.5 45.5 Z"/><rect x="21" y="78" width="58" height="10" rx="5"/></g><g fill="#3c3c3c" clip-path="url(#r3c3c3c)"><circle cx="50" cy="25" r="13"/><rect x="33" y="38.5" width="34" height="7" rx="3.5"/>

<ellipse cx="45" cy="20" rx="4.5" ry="3" fill="#5a5a5a" opacity=".9" transform="rotate(-35 45 20)"/></g></svg>
      <span>Opening<b>Lab</b></span>
    </div>
    <button class="nav on" data-nav="opening" id="nav-opening">
      <svg viewBox="0 0 24 24" fill="none" stroke="#81b64c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 5h7a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H2z"/><path d="M22 5h-7a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h8z"/></svg>

{id:'italian',type:'opening',side:'w',eco:'C54',family:'1.e4',name:'Italian Game: Giuoco Piano',
 desc:'A classical setup: quick development, the bishop aims at f7, and c3 + d4 builds a big center.',
 pgn:`e4 {Grabs the center and opens lines for the queen and bishop.} e5 Nf3 {Develops with an attack on e5.} Nc6 Bc4 {The Italian bishop eyes Black's weakest square, f7.} Bc5 c3 {Prepares d4 to build a pawn center.} Nf6 d4 {Strikes in the center at once.} exd4 cxd4 {White now has the ideal e4 + d4 duo.} Bb4+ {Black gains time with a check.} Bd2 Bxd2+ Nbxd2 d5 {Black must break the center before it rolls forward.} exd5 Nxd5 Qb3 {Pressure on d5 and b7. White has an easy, active game.}`},
{id:'ruy',type:'opening',side:'w',eco:'C84',family:'1.e4',name:'Ruy Lopez: Closed',
 desc:'The "Spanish Torture". White pressures the knight that defends e5 and plays for a slow, lasting edge.',
 pgn:`e4 e5 Nf3 Nc6 Bb5 {Attacks the defender of e5.} a6 {The Morphy Defense: question the bishop right away.} Ba4 {Keep the pin-like pressure.} Nf6 O-O {Castle first; e4 is indirectly protected.} Be7 Re1 {Now e4 is solidly defended.} b5 Bb3 d6 c3 {Makes a retreat square for the bishop and prepares d4.} O-O h3 {Stops ...Bg4 before playing d4. A main tabiya of the Closed Ruy Lopez.}`},
{id:'scotch',type:'opening',side:'w',eco:'C45',family:'1.e4',name:'Scotch Game',
 desc:'White opens the center immediately with d4. Clear plans and open lines, popular with Kasparov and Carlsen.',
 pgn:`e4 e5 Nf3 Nc6 d4 {Hits e5 right away and opens the position.} exd4 Nxd4 {White controls the center with a piece.} Nf6 Nxc6 {The Mieses line: trade, then push e5.} bxc6 e5 {Kicks the f6 knight.} Qe7 Qe2 {Pins the e5 pawn's attacker and keeps the pawn.} Nd5 c4 {Drives the knight away and grabs space.} Ba6 {Black pins c4 against the queen; sharp but balanced.}`},
{id:'qgd',type:'opening',side:'w',eco:'D55',family:'1.d4',name:"Queen's Gambit Declined",
 desc:'The most classical answer to 1.d4 d5. White offers the c-pawn to win the center and develops harmoniously.',
 pgn:`d4 d5 c4 {The Queen's Gambit: undermine Black's d5 pawn.} e6 {Declined: Black keeps a strong point on d5.} Nc3 Nf6 Bg5 {Pins the knight that defends d5.} Be7 e3 O-O Nf3 h6 Bh4 {Keeps the pin. White plans Rc1, Bd3 and the minority attack.} b6 cxd5 Nxd5 Bxe7 Qxe7 Nxd5 exd5 Rc1 {Pressure down the c-file against c7.}`},
{id:'london',type:'opening',side:'w',eco:'D02',family:'1.d4',name:'London System',
 desc:'A reliable system: same setup against almost anything. Bf4, e3, c3, Nbd2, Bd3 and a solid pyramid.',
 pgn:`d4 d5 Bf4 {The London bishop comes out before e3 locks it in.} Nf6 e3 e6 Nf3 c5 c3 {The pawn triangle c3-d4-e3 is very hard to break.} Nc6 Nbd2 Bd6 Bg3 {Keeps the bishop; if ...Bxg3 then hxg3 opens the h-file.} O-O Bd3 {Aims at h7. White plays Ne5, Qf3 or a kingside attack.}`},
{id:'english',type:'opening',side:'w',eco:'A29',family:'Flank',name:'English Opening: Four Knights',
 desc:'1.c4 is a Sicilian with an extra tempo. White fianchettoes and fights for the light squares.',
 pgn:`c4 {Controls d5 from the side.} e5 Nc3 Nf6 Nf3 Nc6 g3 {Fianchetto: the g2 bishop will rake the long diagonal.} d5 cxd5 Nxd5 Bg2 Nb6 O-O Be7 d3 O-O a3 {Prepares b4 and queenside expansion.}`},
{id:'vienna',type:'opening',side:'w',eco:'C29',family:'1.e4',name:'Vienna Gambit',
 desc:'An aggressive sideline: Nc3 then f4, like a King\'s Gambit with better preparation.',
 pgn:`e4 e5 Nc3 {Prepares f4 while keeping e4 protected.} Nf6 f4 {The Vienna Gambit.} d5 {Best: Black strikes back in the center.} fxe5 Nxe4 Nf3 {Develop and support e5.} Be7 d4 O-O Bd3 {White has space and attacking chances on the kingside.}`},
{id:'kga',type:'opening',side:'w',eco:'C39',family:'1.e4',name:"King's Gambit: Accepted (Kieseritzky)",
 desc:'The romantic gambit. White gives a pawn for rapid development and an open f-file.',
 pgn:`e4 e5 f4 {Offers a pawn to deflect Black's e-pawn.} exf4 Nf3 {Stops ...Qh4+ and develops.} g5 {Black tries to hold the extra pawn.} h4 {Undermine the pawn chain at once.} g4 Ne5 {The Kieseritzky Gambit: a strong central knight.} Nf6 Bc4 d5 exd5 Bd6 d4 {White has a sharp, dynamic game.}`},
{id:'evans',type:'opening',side:'w',eco:'C52',family:'1.e4',name:'Evans Gambit',
 desc:'A pawn sacrifice in the Italian to gain time for c3 and d4. Loved by Morphy and Kasparov.',
 pgn:`e4 e5 Nf3 Nc6 Bc4 Bc5 b4 {The Evans Gambit: deflect the bishop.} Bxb4 c3 {Gains a tempo on the bishop.} Ba5 d4 {Center with tempo.} exd4 O-O {Fast development over material.} Nge7 cxd4 d5 exd5 Nxd5 Ba3 {Stops Black from castling. Huge initiative.}`},
{id:'catalan',type:'opening',side:'w',eco:'E05',family:'1.d4',name:'Catalan Opening',
 desc:'Queen\'s Gambit + kingside fianchetto. The g2 bishop puts long-term pressure on the queenside.',
 pgn:`d4 Nf6 c4 e6 g3 {The Catalan bishop will aim at b7 and a8.} d5 Bg2 Be7 Nf3 O-O O-O dxc4 {Black takes the pawn.} Qc2 {White wins it back comfortably.} a6 Qxc4 b5 Qc2 Bb7 Bd2 {Prepares Ba5 or Rc1. A quiet, strong positional edge.}`},
{id:'reti',type:'opening',side:'w',eco:'A13',family:'Flank',name:'Réti Opening',

function parsePgn(p){const out=[];const re=/\{([^}]*)\}|(\S+)/g;let m;while((m=re.exec(p))){if(m[1]!==undefined){if(out.length)out[out.length-1].c=m[1].trim();}else out.push({san:m[2]});}return out;}
LINES.filter(L=>L.type==='opening').forEach(P=>{const ci=P.name.indexOf(':');P.base=ci>0?P.name.slice(0,ci):P.name;P.varName=ci>0?P.name.slice(ci+1).trim():'Main line';P.kids=[];
  (VARIATIONS[P.id]||[]).forEach((v,k)=>{const C={id:P.id+'-v'+(k+1),type:'opening',side:P.side,eco:v.eco||P.eco,family:P.family,parent:P.id,base:P.base,varName:v.name,
    name:P.base+': '+v.name,desc:v.desc||('A key line of the '+P.base+'. The notes on each move explain the plans.'),pgn:v.pgn};P.kids.push(C.id);LINES.push(C);});});
{const cnt={};LINES.filter(L=>L.type==='opening'&&!L.parent).forEach(L=>cnt[L.base]=(cnt[L.base]||0)+1);
  LINES.filter(L=>L.type==='opening'&&!L.parent&&cnt[L.base]>1).forEach(P=>{P.head=P.name;});}
LINES.forEach(L=>{if(!L.pgn)return;const pm=parsePgn(L.pgn);L.book=pm.map(x=>x.san);L.notes=pm.map(x=>x.c||'');
  let s='';L.book.slice(0,8).forEach((m,i)=>{s+=(i%2?'':((i/2+1)+'.'))+m+' ';});L.preview=s.trim()+(L.book.length>8?' …':'');});
const SHORT={'Mate in 1':'M1','Mate in 2':'M2','Opening trap':'Trap'};
const countPiece=(fen,ch)=>fen.split(' ')[0].split('').filter(c=>c===ch).length;
function addFixed(arr,type){arr.forEach(p=>{const g=new Chess(p.fen);const pm=parsePgn(p.pgn);const side=g.turn();
  LINES.push(Object.assign({},p,{type,side,book:pm.map(x=>x.san),notes:pm.map(x=>x.c||''),eco:SHORT[p.theme]||p.theme,family:p.theme,
    preview:(side==='w'?'White':'Black')+' to move · '+p.theme}));});}
addFixed(PUZZLES,'puzzle');
Object.entries(TRAP_PUZZLES).forEach(([id,k])=>{const T=LINES.find(x=>x.id===id);const g=new Chess();for(let i=0;i<k;i++)g.move(T.book[i]);const side=g.turn();
  LINES.push({id:'pz-'+id,type:'puzzle',theme:'Opening trap',family:'Opening trap',eco:'Trap',name:T.name,fen:g.fen(),side,book:T.book.slice(k),notes:T.notes.slice(k),
    desc:'From the '+T.name+'. Find the winning idea.',preview:(side==='w'?'White':'Black')+' to move · from the '+T.name});});
addFixed(MIDDLEGAME,'middlegame');
const GOALTXT={mate:'Checkmate',promote:'Make a queen',capture:'Stop the pawn'};
ENDGAME.forEach(p=>{const side=new Chess(p.fen).turn();LINES.push(Object.assign({},p,{type:'endgame',side,book:[],notes:[],eco:p.theme.split(' ')[0],family:p.theme,
  q0:countPiece(p.fen,side==='w'?'Q':'q'),preview:(side==='w'?'White':'Black')+' · '+GOALTXT[p.goal]+' in '+p.limit+' moves'}));});
// Opening Explorer: every named line from the Lichess database, grouped by opening family.
{const fams={};EXPLORER.forEach(([eco,name,mv],i)=>{const ci=name.indexOf(':');const fam=ci>0?name.slice(0,ci):name;const book=mv.split(' ');
  let pv='';book.slice(0,8).forEach((m,k)=>{pv+=(k%2?'':((k/2+1)+'.'))+m+' ';});
  const L={id:'x'+i,type:'explorer',side:book.length%2?'w':'b',eco,family:fam,base:fam,head:fam,varName:ci>0?name.slice(ci+1).trim():'Main line',name,book,notes:[],
    desc:'A named line from the opening database (ECO '+eco+'). Use the White and Black buttons to choose your side.',preview:pv.trim()+(book.length>8?' …':'')};
  (fams[fam]=fams[fam]||[]).push(L);LINES.push(L);});
 Object.values(fams).forEach(list=>{list.sort((a,b)=>a.book.length-b.book.length||a.name.localeCompare(b.name));const P=list.find(l=>l.name===l.family)||list[0];
   P.kids=list.filter(l=>l!==P).map(l=>{l.parent=P.id;return l.id;});});}

// ---------- state ----------
const S={cat:'opening',side:'all',q:'',line:null,moves:[],ply:0,mode:'study',orient:'w',sel:null,
  pr:{mistakes:0,done:false,busy:false,hint:false,wrong:null,result:null},badge:null,tab:'lib'};
let cur=new Chess();

function chessAt(ply){const g=new Chess(S.line&&S.line.fen?S.line.fen:undefined);let last=null;for(let i=0;i<ply;i++){last=g.move(S.moves[i]);}return{g,last};}
function divergence(){if(!S.line)return 0;let i=0;while(i<S.moves.length&&S.moves[i]===S.line.book[i])i++;return i;}

const FILES='abcdefgh';const ANIM=260;
function sqXY(sq){const f=FILES.indexOf(sq[0]),r=+sq[1]-1;return S.orient==='w'?{x:f,y:7-r}:{x:7-f,y:r};}
function xySq(x,y){return S.orient==='w'?FILES[x]+(8-y):FILES[7-x]+(y+1);}
function buildSquares(){const el=$('sqs');el.innerHTML='';for(let y=0;y<8;y++)for(let x=0;x<8;x++){const sq=xySq(x,y);const f=FILES.indexOf(sq[0]),r=+sq[1];
  const d=document.createElement('div');d.className='sq '+(((f+r)%2===0)?'l':'d');d.dataset.sq=sq;d.id='sq-'+sq;
  if(x===0){const c=document.createElement('span');c.className='co r';c.textContent=r;d.appendChild(c);}
  if(y===7){const c=document.createElement('span');c.className='co f';c.textContent=sq[0];d.appendChild(c);}
  el.appendChild(d);}
  // ((f+r)%2===0) → a1 (0+1)=odd → dark; fix parity
  el.querySelectorAll('.sq').forEach(d=>{const sq=d.dataset.sq;const dark=(FILES.indexOf(sq[0])+(+sq[1]))%2===1;d.classList.toggle('d',dark);d.classList.toggle('l',!dark);});
}
function render(anim){
  const {g,last}=chessAt(S.ply);cur=g;
  document.querySelectorAll('.sq').forEach(d=>d.classList.remove('hl','sel','chk','dot','ring','wrong','pre','mated'));
  if(S.pre){$('sq-'+S.pre.from).classList.add('pre');$('sq-'+S.pre.to).classList.add('pre');}
  if(S.pr.wrong){[S.pr.wrong.from,S.pr.wrong.to].forEach(s=>$('sq-'+s).classList.add('wrong'));}
  else if(last){$('sq-'+last.from).classList.add('hl');$('sq-'+last.to).classList.add('hl');}
  if(g.in_check()){const b=g.board();for(let r=0;r<8;r++)for(let f=0;f<8;f++){const p=b[r][f];if(p&&p.type==='k'&&p.color===g.turn())$('sq-'+FILES[f]+(8-r)).classList.add('chk');}}
  if(S.sel){$('sq-'+S.sel).classList.add('sel');if(opts.legal)(preAllowed()?preMoves(S.sel):g.moves({square:S.sel,verbose:true})).forEach(m=>$('sq-'+m.to).classList.add(m.captured?'ring':'dot'));}
  // pieces
  const pcs=$('pcs');pcs.innerHTML='';const b=g.board();const wrongG=S.pr.wrong?S.pr.wrong.g:null;const bb=wrongG?wrongG.board():b;
  for(let r=0;r<8;r++)for(let f=0;f<8;f++){const p=bb[r][f];if(!p)continue;const sq=FILES[f]+(8-r);if(S.pre&&sq===S.pre.to)continue;const {x,y}=sqXY(S.pre&&sq===S.pre.from?S.pre.to:sq);
    const e=document.createElement('div');e.className='pc';e.style.left=(x*12.5)+'%';e.style.top=(y*12.5)+'%';e.style.backgroundImage='url("'+PIECES[p.color+p.type]+'")';e.dataset.sq=sq;pcs.appendChild(e);}
  // checkmate: glow + shake on the mated king, # and crown badges, result card
  const mated=g.in_checkmate();const card=$('mate-card');
  if(mated){const loser=g.turn(),bd=g.board();let lk=null,wk=null;
    for(let r=0;r<8;r++)for(let f=0;f<8;f++){const p=bd[r][f];if(p&&p.type==='k'){const sq=FILES[f]+(8-r);if(p.color===loser)lk=sq;else wk=sq;}}
    const fresh=S.mateFen!==g.fen();S.mateFen=g.fen();
    $('sq-'+lk).classList.add('mated');
    const ke=pcs.querySelector('.pc[data-sq="'+lk+'"]');if(ke&&fresh)ke.classList.add('shake');
    [[lk,'#','#8b0000'],[wk,ICON.crown,'var(--green)']].forEach(([sq,html,bg])=>{const {x,y}=sqXY(sq);const e=document.createElement('div');e.className='badge big'+(fresh?' fresh':'');
      e.style.left='calc('+((x+1)*12.5)+'% - '+(x===7?'6%':'3%')+')';e.style.top='calc('+(y*12.5)+'% + '+(y===0?'.4%':'-1.8%')+')';e.style.background=bg;e.innerHTML=html;pcs.appendChild(e);});
    const win=loser==='w'?'Black':'White';
    if(fresh){card.classList.remove('on');card.innerHTML='<div class="crown">'+ICON.crown+'</div><div class="t">Checkmate</div><div class="s">'+win+' wins</div>';
      clearTimeout(S.mateT);S.mateT=setTimeout(()=>card.classList.add('on'),750);}
  }else{S.mateFen=null;clearTimeout(S.mateT);card.classList.remove('on');}
  // badge
  if(S.badge&&!mated){const {x,y}=sqXY(S.badge.sq);const e=document.createElement('div');e.className='badge';e.style.left='calc('+((x+1)*12.5)+'% - '+(x===7?'5%':'2.6%')+')';e.style.top='calc('+(y*12.5)+'% + '+(y===0?'.4%':'-1.4%')+')';e.style.background=BCOL[S.badge.kind];e.innerHTML=ICON[S.badge.kind];pcs.appendChild(e);}
  // animate
  const mv=anim===true?last:(anim&&anim.from?anim:null);
  if(mv&&!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    const pairs=[[mv.from,mv.to]];const rk=mv.to[1];
    if(mv.flags&&mv.flags.includes('k'))pairs.push(['h'+rk,'f'+rk]);if(mv.flags&&mv.flags.includes('q'))pairs.push(['a'+rk,'d'+rk]);
    pairs.forEach(([fr,to])=>{const e=pcs.querySelector('.pc[data-sq="'+to+'"]');if(!e)return;const a=sqXY(fr),c=sqXY(to);
      e.style.transition='none';e.style.transform='translate('+((a.x-c.x)*100)+'%,'+((a.y-c.y)*100)+'%)';e.style.zIndex=3;e.getBoundingClientRect();
      e.style.transition='transform '+ANIM+'ms cubic-bezier(.25,.75,.3,1)';e.style.transform='';});}
  drawArrows();renderPlayers();renderMoves();renderCoach();renderControls();
}
function drawArrows(){const svg=$('arrows');svg.innerHTML='';if(!S.line||S.pr.wrong)return;
  let next=null;
  if(cur.turn()!==S.line.side)return; // never hint the opponent's move
  if(S.mode==='study'&&opts.arrow){const d=divergence();if(S.ply<S.line.book.length&&S.ply<=d)next=S.line.book[S.ply];}
  if(S.mode==='practice'&&S.pr.hint&&S.ply<S.line.book.length)next=S.line.book[S.ply];
  if(!next)return;const g=new Chess(cur.fen());const m=g.move(next);if(!m)return;
  const a=sqXY(m.from),b=sqXY(m.to);const x1=a.x+.5,y1=a.y+.5,x2=b.x+.5,y2=b.y+.5;
  const isKnight=m.piece==='n';const pts=[];
  if(isKnight){const dx=b.x-a.x,dy=b.y-a.y;const corner=Math.abs(dx)>Math.abs(dy)?{x:x2,y:y1}:{x:x1,y:y2};pts.push([x1,y1],[corner.x,corner.y],[x2,y2]);}else pts.push([x1,y1],[x2,y2]);
  // start a bit off-centre, end where the head begins
  const unit=(a,b)=>{const l=Math.hypot(b[0]-a[0],b[1]-a[1]);return[(b[0]-a[0])/l,(b[1]-a[1])/l];};
  const [sx0,sy0]=unit(pts[0],pts[1]);pts[0]=[pts[0][0]+sx0*.22,pts[0][1]+sy0*.22];
  const [ux,uy]=unit(pts[pts.length-2],pts[pts.length-1]);const hx=x2-ux*.4,hy=y2-uy*.4;
  const shaft=pts.slice(0,-1).concat([[hx,hy]]);
  const poly=[[x2-ux*.05,y2-uy*.05],[hx-uy*.24,hy+ux*.24],[hx+uy*.24,hy-ux*.24]];
  const col=S.mode==='practice'?'rgba(95,168,232,.85)':'rgba(255,170,0,.85)';
  svg.innerHTML='<polyline points="'+shaft.map(p=>p.join(',')).join(' ')+'" fill="none" stroke="'+col+'" stroke-width=".2" stroke-linejoin="round"/><polygon points="'+poly.map(p=>p.join(',')).join(' ')+'" fill="'+col+'"/>';
}
function renderPlayers(){
  const me=S.line?S.line.side:S.orient;const top=S.orient==='w'?'b':'w',bot=S.orient;
  const mk=(c,el)=>{const you=S.line&&c===me;const name=you?'You':(S.line?(S.line.type==='trap'?'Victim':S.line.type==='endgame'?'Computer':'Opponent'):(c==='w'?'White':'Black'));
    const turn=cur.turn()===c&&!cur.game_over();
    el.innerHTML='<div class="avatar"><img alt="" src="'+PIECES[c+(you?'k':'p')]+'"></div><div class="pname">'+name+'<span class="ptag">'+(c==='w'?'White':'Black')+'</span></div><div class="clock'+(turn?' on':'')+'">'+(cur.in_checkmate()?(cur.turn()===c?'Checkmated':'Won'):cur.game_over()?'Draw':turn?'To move':'Waiting')+'</div>';};
  mk(top,$('p-top'));mk(bot,$('p-bot'));
}
function plyInfo(i){const L=S.line;const off=L&&L.fen&&L.fen.split(' ')[1]==='b'?1:0;const base=L&&L.fen?(+L.fen.split(' ')[5]||1):1;const p=i+off;return{num:base+Math.floor(p/2),black:p%2===1,off};}
function renderMoves(){const el=$('moves');if(!S.line){el.innerHTML='';return;}
  const eg=S.line.type==='endgame';const d=divergence();const hideAhead=S.mode==='practice'&&!eg;
  const showUpTo=hideAhead?S.ply:S.moves.length;const total=hideAhead?S.line.book.length:S.moves.length;const off=plyInfo(0).off;
  let h='';for(let i=-off;i<total;i+=2){h+='<div class="mrow"><span class="n">'+plyInfo(Math.max(i,0)).num+'.</span>';for(let j=i;j<i+2;j++){
      if(j<0){h+='<span class="m" style="pointer-events:none;color:var(--fg3)">…</span>';continue;}if(j>=total){h+='<span></span>';continue;}
      const hidden=j>=showUpTo;const san=hidden?'':S.moves[j]||S.line.book[j];const offb=!eg&&!hidden&&j>=d;const note=!offb&&!hidden&&S.line.notes[j];
      h+='<span class="m'+(j===S.ply-1?' cur':'')+(offb?' off':'')+(hidden?' hid':'')+'" data-ply="'+(j+1)+'">'+(note?'<i class="cdot"></i>':'')+san+'</span>';}
    h+='</div>';}
  if(eg&&!total)h='<div class="empty">Make your first move. The computer answers each move.</div>';
  el.innerHTML=h;const c=el.querySelector('.m.cur');if(c)c.scrollIntoView({block:'nearest'});
}
function moveLabel(i,san){const k=plyInfo(i);return k.num+(k.black?'… ':'. ')+san;}
function renderCoach(){const el=$('bubble');if(!S.line)return;el.className='bubble';
  const L=S.line,i=S.ply-1,d=divergence();const sideName=L.side==='w'?'White':'Black';
  if(S.mode==='practice'&&L.type==='endgame'){const used=Math.ceil(S.ply/2);
    if(S.pr.result==='win'){el.classList.add('good');el.innerHTML='<b>Drill complete!</b> '+GOALTXT[L.goal]+' done in '+used+' move'+(used>1?'s':'')+'.';return;}
    if(S.pr.result){el.classList.add('bad');el.innerHTML='<b>Not this time.</b> '+(S.pr.why||'')+' Press <b>Undo</b> or <b>Try again</b>.';return;}
    el.classList.add('book');el.innerHTML='<b>Goal: '+GOALTXT[L.goal].toLowerCase()+' within '+L.limit+' moves.</b> '+(S.ply===0?L.desc:'Move '+used+' of '+L.limit+'.')+(S.pr.busy?' The computer is thinking…':'');return;}
  if(S.mode==='practice'){
    if(S.pr.result&&PUZZLY(L.type)){el.classList.add('good');el.innerHTML='<b>Solved!</b> '+(S.pr.mistakes?('It took '+(S.pr.mistakes+1)+' tries. Solve it first try to mark it done.'):'First try. Marked as solved.');return;}
    if(S.pr.result){el.classList.add('good');el.innerHTML='<b>Line complete!</b> '+(S.pr.mistakes?('You made '+S.pr.mistakes+' mistake'+(S.pr.mistakes>1?'s':'')+'. Try again with zero to master it.'):'Perfect run. This line is now mastered.');return;}
    if(S.pr.wrong){el.classList.add('bad');el.innerHTML='<span class="mv">'+S.pr.wrong.san+'</span> '+(PUZZLY(L.type)?'is not the best move':'is not the book move')+'. Try again.';return;}
    const mine=cur.turn()===L.side;
    if(mine){const prev=i>=0?('<span class="mv">'+moveLabel(i,S.moves[i])+'</span> '+(L.notes[i]?L.notes[i]+' ':'')):'';
      el.classList.add('book');el.innerHTML=prev+(PUZZLY(L.type)?'<b>'+sideName+' to move.</b> '+(i<0?L.desc+' ':'')+'Find the best move':'<b>Your move as '+sideName+'.</b> Find the book move')+(S.pr.mistakes?' ('+S.pr.mistakes+' mistake'+(S.pr.mistakes>1?'s':'')+' so far)':'')+'.';}
    else if(i>=0){el.classList.add('good');el.innerHTML='<b>Correct!</b> <span class="mv">'+moveLabel(i,S.moves[i])+'</span> '+(L.notes[i]||'');}
    else{el.classList.add('book');el.innerHTML='You play <b>'+sideName+'</b>. Your opponent moves first.';}
    return;}
  if(S.ply===0){el.classList.add('book');el.innerHTML='<b>'+L.name+'.</b> '+L.desc+' Press <b>▶</b> or use the arrow keys to step through the moves.';return;}
  if(i>=d){el.classList.add('bad');el.innerHTML='<span class="mv">'+moveLabel(i,S.moves[i])+'</span> leaves the book line. Step back or press <b>Back to line</b> to return.';return;}
  el.classList.add(cur.in_checkmate()?'good':'book');
  el.innerHTML='<span class="mv">'+moveLabel(i,S.moves[i])+'</span> '+(L.notes[i]||'Book move.')+(S.ply===L.book.length?' <b>End of the line.</b>':'');
}
function renderControls(){
  const lineMode=!!S.line;const pr=S.mode==='practice';
  $('b-first').disabled=$('b-prev').disabled=!lineMode||pr||S.ply===0;
  $('b-next').disabled=$('b-last').disabled=!lineMode||pr||S.ply>=S.moves.length;
  const L=$('a-left'),R=$('a-right');
  if(!lineMode){L.textContent='Random drill';R.textContent='Study first line';L.hidden=false;return;}
  L.hidden=false;
  if(pr&&S.line.type==='endgame'){L.textContent='Undo';L.disabled=S.pr.busy||S.ply===0;R.textContent=S.pr.result==='win'?'Next drill':S.pr.result?'Try again':'Restart';return;}
  const nxt={puzzle:'Next puzzle',middlegame:'Next drill'}[S.line.type]||'Next line';
  if(pr){L.textContent=S.pr.hint?'Hide hint':'Hint';R.textContent=S.pr.result?nxt:'Restart';L.disabled=!!S.pr.result;}
  else{L.disabled=false;const off=S.ply>divergence();L.textContent=off?'Back to line':'Restart';R.textContent='Practice';}
}

// ---------- library ----------
const EXP={};
const CHEV='<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
function lq(L){return L._q||(L._q=(L.name+' '+L.eco+' '+L.family+' '+L.book.join(' ')).toLowerCase());}
function okL(L,q){return (S.side==='all'||L.side0===S.side)&&(!q||q.split(/\s+/).every(w=>lq(L).includes(w)));}
function pieceIcon(L){const sd=L.side0||L.side;return '<span class="ic '+sd+'"><img alt="" src="'+PIECES[sd+({trap:'n',puzzle:'q',middlegame:'b',endgame:'r'}[L.type]||'k')]+'"></span>';}
function okDot(id){const d=mastered[id];return '<span class="ok'+(d?'':' no')+'" title="'+(d?'Mastered':'Not mastered yet')+'">'+(d?ICON.check:'')+'</span>';}
function rowHtml(L,sub){return '<button class="item'+(sub?' sub':'')+(S.line&&S.line.id===L.id?' cur':'')+'" data-id="'+L.id+'">'+(sub?'<span class="tree"></span>':pieceIcon(L))+
  '<span class="tx"><div class="nm">'+(sub?L.varName+(L.parent||L.varName==='Main line'?'':'<span class="maintag">Main line</span>'):L.name)+'</div><div class="pv">'+L.preview+'</div></span><span class="eco">'+L.eco+'</span>'+okDot(L.id)+'</button>';}
function renderList(){const q=S.q.trim().toLowerCase();const ex=S.cat==='explorer';
  const items=LINES.filter(L=>L.type===S.cat&&!L.parent&&(okL(L,q)||(L.kids||[]).some(id=>okL(byId[id],q))));
  const groups={};items.forEach(L=>{const k=ex?L.base[0].toUpperCase():(L.side0==='w'?'White':'Black')+' · '+L.family;(groups[k]=groups[k]||[]).push(L);});
  const el=$('list');if(!items.length){el.innerHTML='<div class="empty">Nothing matches “'+S.q.replace(/</g,'&lt;')+'”.</div>';return;}
  let h=ex&&!q?'<div class="empty" style="padding:12px 16px;text-align:left">'+LINES.filter(L=>L.type==='explorer').length.toLocaleString()+' named lines in '+items.length+' openings. Search by name, ECO code or moves.</div>':'';
  Object.keys(groups).sort((a,b)=>a.localeCompare(b)).forEach(k=>{h+='<div class="grp">'+k+'</div>';groups[k].forEach(L=>{
    if(!(L.kids&&L.kids.length)){h+=rowHtml(L,false);return;}
    const fam=[L.id].concat(L.kids);const vis=fam.filter(id=>okL(byId[id],q));
    const open=EXP[L.id]!==undefined?EXP[L.id]:(!!q&&vis.length<=60&&L.kids.some(id=>okL(byId[id],q)))||(S.line&&fam.includes(S.line.id));
    const nDone=fam.filter(id=>mastered[id]).length;
    h+='<div class="fam'+(open?' open':'')+'"><button class="item famhead" data-exp="'+L.id+'" aria-expanded="'+open+'">'+pieceIcon(L)+'<span class="tx"><div class="nm">'+(L.head||L.base)+'</div><div class="pv">'+(q&&vis.length<fam.length?vis.length+' of ':'')+fam.length+' lines · '+nDone+' mastered</div></span><span class="eco">'+L.eco+'</span>'+CHEV+'</button>';
    h+='<div class="subs">'+(open?vis.map(id=>rowHtml(byId[id],true)).join(''):'')+'</div></div>';});});
  el.innerHTML=h;const c=el.querySelector('.item.cur');if(c&&S.scrollCur){S.scrollCur=false;c.scrollIntoView({block:'center'});}}
function renderProgress(){const core=LINES.filter(L=>L.type!=='explorer');const n=core.filter(L=>mastered[L.id]).length;$('prog-txt').textContent=n+' of '+core.length+' mastered';$('prog-bar').style.width=(n/core.length*100)+'%';
  ['opening','explorer','trap','puzzle','middlegame','endgame'].forEach(t=>{const all=LINES.filter(L=>L.type===t);$('cnt-'+t).textContent=all.filter(L=>mastered[L.id]).length+'/'+all.length;});}
function setTab(t){S.tab=t;if(t==='lib')S.scrollCur=true;$('tab-lib').classList.toggle('on',t==='lib');$('tab-line').classList.toggle('on',t==='line');$('v-lib').hidden=t!=='lib';$('v-line').hidden=t!=='line';}

// ---------- line control ----------
function openLine(id,mode){const L=byId[id];if(!L)return;S.line=L;S.moves=L.book.slice();S.ply=0;S.sel=null;S.badge=null;S.orient=L.side;S.cat=L.type;
  try{history.replaceState(null,'','#'+id);}catch(e){}
  $('l-name').textContent=L.name;$('l-desc').textContent=L.desc;
  setMeta();
  document.querySelectorAll('.nav[data-nav]').forEach(n=>n.classList.toggle('on',n.dataset.nav===L.type));
  const lbl=PUZZLY(L.type)?['Show solution','Solve it']:['Study the line','Practice it'];$('m-study').textContent=lbl[0];$('m-practice').textContent=lbl[1];
  $('l-modes').hidden=L.type==='endgame';
  const P=L.parent?byId[L.parent]:L;const fam=P.kids&&P.kids.length?[P.id].concat(P.kids):[];const big=fam.length>12;$('l-vars').hidden=!fam.length||big;$('l-varsel').hidden=!big;
  if(big)$('l-varsel').innerHTML=fam.map(id=>{const V=byId[id];return '<option value="'+id+'"'+(id===L.id?' selected':'')+'>'+(mastered[id]?'✓ ':'')+V.varName+'</option>';}).join('');
  const sidePick=L.type==='opening'||L.type==='explorer';$('l-side').hidden=!sidePick;
  $('l-side').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.ps===L.side));
  $('l-vars').innerHTML=fam.map(id=>{const V=byId[id];return '<button data-var="'+id+'" class="'+(id===L.id?'on':'')+'">'+V.varName+(mastered[id]?'<span class="ck">✓</span>':'')+'</button>';}).join('');
  buildSquares();setMode(mode||(L.type==='opening'||L.type==='trap'||L.type==='explorer'?'study':'practice'));setTab('line');renderList();}
function setMeta(){const L=S.line;const TL={explorer:'Explorer',opening:'Opening',trap:'Trap',puzzle:'Puzzle',middlegame:'Middlegame',endgame:'Endgame'};const sn=L.side==='w'?'White':'Black';
  $('l-meta').innerHTML='<span class="chip '+(L.type==='trap'?'trap':'op')+'">'+TL[L.type]+'</span><span class="chip">'+(L.theme||L.eco)+'</span><span class="chip">'+(L.type==='opening'||L.type==='trap'||L.type==='explorer'?'Play as '+sn:sn+' to move')+'</span><span class="chip">'+(L.type==='endgame'?GOALTXT[L.goal]+' · '+L.limit+' moves':Math.ceil(L.book.length/2)+' moves')+'</span>'+(mastered[L.id]?'<span class="chip op">✓ Mastered</span>':'');}
function setMode(m){S.pre=null;S.mode=m;$('m-study').classList.toggle('on',m==='study');$('m-practice').classList.toggle('on',m==='practice');
  S.pr={mistakes:0,done:false,busy:false,hint:false,wrong:null,result:null,lastGood:false};S.badge=null;S.sel=null;
  S.busy=false;S.moves=S.line.book.slice();S.ply=0;render();snd('start');
  if(m==='practice'){if(S.line.type!=='endgame')maybeOpponent();}else studyReply();}
// Study mode: you move only your own pieces; the opponent answers by itself.
function studyReply(){if(S.mode!=='study'||!S.line||cur.game_over()||cur.turn()===S.line.side)return;
  const line=S.line,at=S.ply;
  if(at>=S.moves.length&&at<=divergence())return; // end of the book line
  S.busy=true;render();
  setTimeout(()=>{S.busy=false;if(S.mode!=='study'||S.line!==line||S.ply!==at)return;
    if(S.ply>=S.moves.length){const m=bestMove(new Chess(cur.fen()));if(!m){render();return;}S.moves=S.moves.concat(m.san);}
    go(S.ply+1);runPre();},S.ply>=S.moves.length?250:480);}
// Small 2-ply search for replies once you leave the book.
const VAL={p:100,n:310,b:330,r:500,q:900,k:0};
function evalPos(g){if(g.in_checkmate())return g.turn()==='w'?-1e5:1e5;if(g.in_draw())return 0;let s=0;const b=g.board();
  const pieces=b.flat().filter(p=>p&&p.type!=='k'&&p.type!=='p').length;const endg=pieces<=3;
  for(let r=0;r<8;r++)for(let f=0;f<8;f++){const p=b[r][f];if(!p)continue;let v=VAL[p.type];
    if(p.type==='k'&&endg)v+=28-8*Math.max(Math.abs(3.5-f),Math.abs(3.5-r));
    if(p.type!=='k'&&p.type!=='q'){v+=12-3*(Math.abs(3.5-f)+Math.abs(3.5-r));}
    if(p.type==='p')v+=(p.color==='w'?6-r:r-1)*4;
    s+=p.color==='w'?v:-v;}
  return s;}
function bestMove(g){const sign=g.turn()==='w'?1:-1;let best=null,bs=-Infinity;const ms=g.moves({verbose:true}).sort(()=>Math.random()-.5);
  ms.sort((a,b)=>(b.captured?VAL[b.captured]:0)-(a.captured?VAL[a.captured]:0));
  for(const m of ms){g.move(m);let worst=Infinity;const rs=g.moves({verbose:true});
    if(!rs.length)worst=sign*evalPos(g);
    else for(const r of rs){g.move(r);const v=sign*evalPos(g);g.undo();if(v<worst)worst=v;if(worst<=bs)break;}
    g.undo();if(worst>bs){bs=worst;best=m;}}
  return best;}
// Endgame drills: the computer answers, then the goal is checked.
function egReply(){const L=S.line;S.pr.busy=true;render();
  setTimeout(()=>{if(S.line!==L||S.mode!=='practice'||S.pr.result){S.pr.busy=false;return;}const m=bestMove(new Chess(cur.fen()));S.pr.busy=false;if(!m){egCheck();render();return;}
    S.moves=S.moves.slice(0,S.ply).concat(m.san);S.ply++;const {g,last}=chessAt(S.ply);render(true);moveSound(last,g);if(!egCheck())runPre();else S.pre=null;},420);}
function egCheck(){const L=S.line,g=cur,me=L.side,opp=me==='w'?'b':'w';const used=Math.ceil(S.ply/2);
  const cnt=(c,t)=>g.board().flat().filter(p=>p&&p.color===c&&p.type===t).length;let res=null,why='';
  if(L.goal==='mate'){if(g.in_checkmate())res=g.turn()===opp?'win':'fail';else if(g.in_stalemate()){res='fail';why='Stalemate: the king has no legal move but is not in check. That is a draw.';}
    else if(g.in_draw()){res='fail';why='The game is drawn.';}else if(cnt(me,'q')+cnt(me,'r')===0){res='fail';why='You lost your mating material.';}}
  if(L.goal==='promote'){if(cnt(me,'q')>L.q0&&g.turn()===me)res='win';else if(cnt(me,'p')===0&&cnt(me,'q')<=L.q0){res='fail';why='The pawn was lost.';}else if(g.in_draw()){res='fail';why='The game is drawn.';}}
  if(L.goal==='capture'){if(cnt(opp,'p')===0&&cnt(opp,'q')===0)res='win';else if(cnt(opp,'q')>0){res='fail';why='The pawn became a queen.';}}
  if(!res&&used>=L.limit&&g.turn()===me){res='fail';why='You used all '+L.limit+' moves.';}
  if(!res)return false;
  S.pr.result=res;S.pr.why=why;
  if(res==='win'){mastered[L.id]=Date.now();store.set('mastered',mastered);renderProgress();renderList();setMeta();toast('Drill complete!');if(!g.in_checkmate())setTimeout(()=>snd('end'),200);}
  else{setTimeout(()=>snd('bad'),150);}
  render();return true;}
function go(ply,anim){if(!S.line||S.mode==='practice')return;ply=Math.max(0,Math.min(S.moves.length,ply));const fwd=ply===S.ply+1;S.ply=ply;S.sel=null;
  const {g,last}=chessAt(ply);S.badge=last&&ply<=divergence()?{sq:last.to,kind:g.in_checkmate()?'mate':'book'}:null;render(fwd&&anim!==false);if(fwd)moveSound(last,g);}
function maybeOpponent(){if(S.mode!=='practice'||S.pr.result)return;const L=S.line;
  if(S.ply>=L.book.length){finishPractice();return;}
  if(cur.turn()!==L.side){S.pr.busy=true;setTimeout(()=>{if(S.mode!=='practice'||S.line!==L)return;S.ply++;S.pr.busy=false;const {g,last}=chessAt(S.ply);S.badge=null;render(true);moveSound(last,g);
      if(S.ply>=L.book.length)finishPractice();else runPre();},520);}
}
function finishPractice(){S.pr.result=true;if(S.pr.mistakes===0){mastered[S.line.id]=Date.now();store.set('mastered',mastered);}renderProgress();renderList();
  setMeta();if(!cur.in_checkmate())snd('end');toast(PUZZLY(S.line.type)?'Solved!':S.pr.mistakes?'Line complete':'Mastered!');render();}

function tryMove(from,to,dragged){if(!S.line){return false;}const an=dragged?undefined:true;
  const g=new Chess(cur.fen());const cands=g.moves({verbose:true}).filter(m=>m.from===from&&m.to===to);if(!cands.length)return false;
  let pick=cands[0];
  if(cands.length>1){const want=S.ply<S.line.book.length?S.line.book[S.ply]:null;pick=cands.find(c=>c.san===want)||cands.find(c=>c.promotion==='q')||cands[0];}
  const san=pick.san;
  if(S.mode==='practice'&&S.line.type==='endgame'){if(S.pr.busy||S.pr.result||cur.turn()!==S.line.side)return false;
    S.moves=S.moves.slice(0,S.ply).concat(san);S.ply++;S.badge=null;const {g:g2,last}=chessAt(S.ply);render(an);moveSound(last,g2);
    if(!egCheck())egReply();return true;}
  if(S.mode==='practice'){
    if(!S.pr.busy&&!S.pr.result&&san!==S.line.book[S.ply]&&S.ply===S.line.book.length-1){const t=new Chess(cur.fen());t.move(san);if(t.in_checkmate())S.moves[S.ply]=san;}
    const okMove=san===S.moves[S.ply];
    if(S.pr.busy||S.pr.result||cur.turn()!==S.line.side)return false;
    if(okMove){S.ply++;S.pr.hint=false;S.pr.lastGood=true;const {g:g2,last}=chessAt(S.ply);S.badge={sq:last.to,kind:g2.in_checkmate()?'mate':'good'};render(an);moveSound(last,g2);
      if(S.ply>=S.line.book.length)finishPractice();else maybeOpponent();}
    else{S.pr.mistakes++;S.pr.lastGood=false;const wg=new Chess(cur.fen());wg.move(san);S.pr.wrong={from,to,san,g:wg};S.badge={sq:to,kind:'bad'};S.pr.busy=true;render();snd('bad');
      setTimeout(()=>{S.pr.wrong=null;S.badge=null;S.pr.busy=false;render();},850);}
    return true;}
  // study / explore
  if(S.busy||cur.turn()!==S.line.side)return false;
  if(S.moves[S.ply]===san){go(S.ply+1,!dragged);studyReply();return true;}
  S.moves=S.moves.slice(0,S.ply).concat(san);S.ply++;const {g:g2,last}=chessAt(S.ply);S.badge=S.ply<=divergence()?{sq:last.to,kind:'book'}:null;render(an);moveSound(last,g2);studyReply();return true;}

// ---------- input (drag & click) ----------
const board=$('board');let drag=null;
function sqFromPoint(cx,cy){const r=board.getBoundingClientRect();const x=Math.floor((cx-r.left)/r.width*8),y=Math.floor((cy-r.top)/r.height*8);if(x<0||y<0||x>7||y>7)return null;return xySq(x,y);}
// Premoves: while the opponent is about to reply, queue one move of your own.
function preAllowed(){return !!(S.line&&!cur.game_over()&&cur.turn()!==S.line.side&&(S.busy||S.pr.busy)&&!S.pr.result&&!S.pr.wrong);}
function preMoves(sq){const t=cur.fen().split(' ');t[1]=S.line.side;t[3]='-';const g=new Chess();if(!g.load(t.join(' ')))return[];return g.moves({square:sq,verbose:true});}
function setPre(from,to){if(!preMoves(from).some(m=>m.to===to))return false;S.pre={from,to};S.sel=null;render();return true;}
function attemptMove(from,to,dragged){return preAllowed()?setPre(from,to):tryMove(from,to,dragged);}
function runPre(){if(!S.pre)return;const p=S.pre;setTimeout(()=>{if(S.pre!==p)return;S.pre=null;if(!S.line||cur.turn()!==S.line.side||!tryMove(p.from,p.to,false))render();},110);}
function clearPre(){if(S.pre){S.pre=null;render();}}
function canPick(sq){if(preAllowed()){const p=cur.get(sq);return !!(p&&p.color===S.line.side);}
  if(!S.line||S.busy||cur.turn()!==S.line.side)return false;if(S.mode==='practice'&&(S.pr.busy||S.pr.result))return false;const p=cur.get(sq);return p&&p.color===cur.turn();}
function snapBack(d){const {x,y}=sqXY(d.sq);const e=d.el;S.sel=null;e.classList.remove('drag');e.style.zIndex=5;
  e.style.transition='left .22s cubic-bezier(.25,.75,.3,1), top .22s cubic-bezier(.25,.75,.3,1)';e.style.left=(x*12.5)+'%';e.style.top=(y*12.5)+'%';
  setTimeout(()=>{if(!drag)render();},230);}
function cancelDrag(){if(!drag)return;const d=drag;drag=null;if(d.moved)snapBack(d);else{S.sel=null;render();}}
board.addEventListener('contextmenu',e=>{e.preventDefault();if(!drag){S.sel=null;clearPre();}});
$('mate-card').addEventListener('pointerdown',e=>{e.stopPropagation();$('mate-card').classList.remove('on');});
board.addEventListener('pointerdown',e=>{if(drag&&e.button!==0){cancelDrag();return;}if(e.button!==0){if(S.sel){S.sel=null;render();}return;}const sq=sqFromPoint(e.clientX,e.clientY);if(!sq)return;
  if(S.sel&&S.sel!==sq){const ok=attemptMove(S.sel,sq,false);if(ok){S.sel=null;return;}}
  if(!canPick(sq)){if(S.sel){S.sel=null;render();}return;}
  e.preventDefault();S.sel=sq;render();const el=$('pcs').querySelector('.pc[data-sq="'+sq+'"]');if(!el)return;
  const r=board.getBoundingClientRect();drag={sq,el,r,moved:false,sx:e.clientX,sy:e.clientY};el.classList.add('drag');board.setPointerCapture(e.pointerId);});
board.addEventListener('pointermove',e=>{if(!drag)return;if(e.buttons&2){cancelDrag();return;}const {el,r}=drag;if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>3)drag.moved=true;if(!drag.moved)return;
  const s=r.width/8;el.style.left=(e.clientX-r.left-s/2)/r.width*100+'%';el.style.top=(e.clientY-r.top-s/2)/r.height*100+'%';});
board.addEventListener('pointerup',e=>{if(!drag||e.button!==0)return;const d=drag;drag=null;const to=sqFromPoint(e.clientX,e.clientY);
  if(d.moved&&to&&to!==d.sq){if(attemptMove(d.sq,to,true)){S.sel=null;if(S.pre)render();return;}}
  if(d.moved){if(to===d.sq){render();}else snapBack(d);}});
board.addEventListener('pointercancel',()=>{cancelDrag();});

// ---------- buttons ----------
const nav=p=>{S.pre=null;go(p);};
$('b-first').onclick=()=>nav(0);$('b-prev').onclick=()=>nav(S.ply-1);$('b-next').onclick=()=>nav(S.ply+1);$('b-last').onclick=()=>nav(S.moves.length);
$('b-flip').onclick=()=>{S.orient=S.orient==='w'?'b':'w';buildSquares();render();};
$('m-study').onclick=()=>S.line&&setMode('study');$('m-practice').onclick=()=>S.line&&setMode('practice');
$('a-left').onclick=()=>{if(!S.line){drill();return;}
  if(S.mode==='practice'&&S.line.type==='endgame'){if(S.pr.busy||!S.ply)return;const n=cur.turn()===S.line.side?2:1;S.moves=S.moves.slice(0,Math.max(0,S.ply-n));S.ply=S.moves.length;S.pr.result=null;S.badge=null;render();return;}
  if(S.mode==='practice'){S.pr.hint=!S.pr.hint;render();return;}
  if(S.ply>divergence()){S.moves=S.line.book.slice();go(divergence());}else{S.moves=S.line.book.slice();go(0);}studyReply();};
$('a-right').onclick=()=>{if(!S.line){const first=LINES.find(L=>L.type===S.cat&&(S.side==='all'||L.side===S.side));if(first)openLine(first.id);return;}
  if(S.mode==='practice'){if(S.pr.result==='win'||(S.pr.result&&S.line.type!=='endgame'))nextLine();else setMode('practice');}else setMode('practice');};
function nextLine(){const t=S.line.type;const P=S.line.parent?byId[S.line.parent]:S.line;
  const pool=t==='explorer'?[P].concat((P.kids||[]).map(id=>byId[id])):LINES.filter(L=>L.type===t&&(t==='opening'||t==='trap'?L.side0===S.line.side0:(S.side==='all'||L.side0===S.side||L===S.line)));const i=pool.indexOf(S.line);openLine(pool[(i+1)%pool.length].id,'practice');}
function drill(){const pool=LINES.filter(L=>L.type!=='explorer'&&(S.side==='all'||L.side0===S.side));const fresh=pool.filter(L=>!mastered[L.id]);const from=fresh.length?fresh:pool;const L=from[Math.floor(Math.random()*from.length)];openLine(L.id,'practice');toast('Drill: '+L.name);}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{if(t.dataset.tab==='line'&&!S.line){toast('Pick a line from the library first');return;}setTab(t.dataset.tab);});
document.querySelectorAll('.nav[data-nav]').forEach(n=>n.onclick=()=>{const v=n.dataset.nav;if(v==='drill'){drill();return;}
  S.cat=v;document.querySelectorAll('.nav[data-nav]').forEach(x=>x.classList.toggle('on',x===n));setTab('lib');renderList();});
$('f-side').querySelectorAll('button').forEach(b=>b.onclick=()=>{S.side=b.dataset.side;$('f-side').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));renderList();});
$('f-q').addEventListener('input',e=>{S.q=e.target.value;renderList();});
$('list').addEventListener('click',e=>{const fh=e.target.closest('[data-exp]');if(fh){const id=fh.dataset.exp;const fam=fh.parentNode;EXP[id]=!fam.classList.contains('open');renderList();return;}
  const it=e.target.closest('.item');if(it)openLine(it.dataset.id);});
$('l-varsel').addEventListener('change',e=>openLine(e.target.value,S.mode==='practice'?'practice':undefined));
$('l-side').addEventListener('click',e=>{const b=e.target.closest('[data-ps]');if(!b||!S.line||b.dataset.ps===S.line.side)return;S.line.side=b.dataset.ps;openLine(S.line.id,S.mode);});
$('l-vars').addEventListener('click',e=>{const b=e.target.closest('[data-var]');if(b&&b.dataset.var!==S.line.id)openLine(b.dataset.var,S.mode==='practice'?'practice':undefined);});
$('moves').addEventListener('click',e=>{const m=e.target.closest('.m');if(m&&S.mode==='study')go(+m.dataset.ply,false);});
[['opt-arrow','arrow'],['opt-legal','legal']].forEach(([id,k])=>{const el=$(id);el.checked=opts[k];el.onchange=()=>{opts[k]=el.checked;store.set(k,el.checked);render();};});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&drag){cancelDrag();return;}if(e.key==='Escape'&&S.pre){clearPre();return;}if(e.target.tagName==='INPUT')return;
  if(e.key==='ArrowLeft'){nav(S.ply-1);e.preventDefault();}else if(e.key==='ArrowRight'){nav(S.ply+1);e.preventDefault();}
  else if(e.key==='ArrowUp'||e.key==='Home'){nav(0);e.preventDefault();}else if(e.key==='ArrowDown'||e.key==='End'){nav(S.moves.length);e.preventDefault();}
  else if(e.key==='f'){$('b-flip').click();}});
let tt;function toast(t){const el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('on'),1600);}

// ---------- boot ----------
$('ic-w').src=PIECES.wp;$('ic-b').src=PIECES.bp;$('ps-w').src=PIECES.wk;$('ps-b').src=PIECES.bk;
buildSquares();renderProgress();renderList();
const h=(location.hash||'').slice(1);
if(byId[h])openLine(h);else{openLine('italian');setTab('lib');}
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(byId[id]&&(!S.line||S.line.id!==id))openLine(id);});
})();
</script>
