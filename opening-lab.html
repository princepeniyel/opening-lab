<title>Opening Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: dark sidebar | board with player bars | tabbed study panel. Single dark look, like a chess server's analysis room. */
:root{
  --bg:#312e2b; --side:#262421; --panel:#262522; --panel2:#1f1e1b; --row:#2b2926; --rowh:#3a3733;
  --line:#3c3a37; --fg:#ffffff; --fg2:#c3c2c1; --fg3:#8b8987;
  --green:#81b64c; --green-d:#45753c; --green-h:#95c45f;
  --sq-l:#ebecd0; --sq-d:#739552; --hl:rgba(255,255,51,.5); --sel:rgba(255,255,51,.5);
  --book:#a88865; --good:#81b64c; --bad:#fa412d; --arrow:rgba(255,170,0,.85);
  --gold:#f7c045;
  --ui:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:14px;margin:0;overflow:hidden}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,.item:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.app{display:flex;height:100%}

/* Sidebar */
.sidebar{width:168px;flex:none;background:var(--side);display:flex;flex-direction:column;padding:10px 0;gap:2px}
.brand{display:flex;align-items:center;gap:8px;padding:8px 14px 16px;font-weight:800;font-size:19px;letter-spacing:-.3px}
.brand svg{width:30px;height:30px;flex:none}
.brand b{color:var(--green)}
.nav{display:flex;align-items:center;gap:12px;padding:10px 14px;font-weight:700;font-size:15px;color:var(--fg2);width:100%;text-align:left}
.nav svg{width:26px;height:26px;flex:none}
.nav:hover{background:#1c1b19;color:var(--fg)}
.nav.on{color:var(--fg);background:#1c1b19}
.nav .cnt{margin-left:auto;font-size:11px;color:var(--fg3);font-weight:600}
.side-foot{margin-top:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.toggle{display:flex;align-items:center;gap:8px;color:var(--fg3);font-size:12px;font-weight:600}
.toggle input{accent-color:var(--green)}
.prog{font-size:12px;color:var(--fg3)}
.dl{display:block;text-align:center;font-size:12px;font-weight:700;color:var(--fg);background:#3c3a37;border-radius:5px;padding:8px;text-decoration:none}
.dl:hover{background:#4a4744}
.bar{height:6px;background:#3d3a36;border-radius:3px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--green);width:0;transition:width .3s}

/* Main */
.main{flex:1;min-width:0;display:flex;justify-content:center;align-items:flex-start;gap:20px;padding:16px 20px;overflow:auto}
.boardcol{display:flex;flex-direction:column;gap:6px;width:var(--bs)}
.boardcol{--bs:clamp(300px,min(calc(100vh - 132px),calc(100vw - 168px - 420px - 80px)),900px)}
.player{display:flex;align-items:center;gap:10px;height:40px}
.avatar{width:36px;height:36px;border-radius:3px;display:grid;place-items:center;background:#4b4847;flex:none;overflow:hidden}
.avatar img{width:30px;height:30px}
.pname{font-weight:700;font-size:14px}
.ptag{font-size:12px;color:var(--fg3);font-weight:500;margin-left:6px}
.clock{margin-left:auto;background:#3c3a37;color:var(--fg3);font-weight:700;font-size:13px;padding:7px 12px;border-radius:3px;min-width:92px;text-align:center}
.clock.on{background:#fff;color:#262421}
.board{position:relative;width:var(--bs);height:var(--bs);border-radius:3px;overflow:hidden;user-select:none;touch-action:none;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.sqs{position:absolute;inset:0;display:grid;grid-template:repeat(8,1fr)/repeat(8,1fr)}
.sq{position:relative}
.sq.l{background:var(--sq-l)} .sq.d{background:var(--sq-d)}
.sq.hl::before,.sq.sel::before{content:"";position:absolute;inset:0;background:var(--hl)}
.sq.chk::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 52%,rgba(120,0,0,1) 0%,rgba(115,0,0,.95) 25%,rgba(100,0,0,.55) 45%,rgba(90,0,0,0) 66%)}
.sq.mated::before{background-position:center;background-repeat:no-repeat;animation:matePulse 1.1s ease-in-out infinite alternate}
@keyframes matePulse{from{background-size:86% 86%}to{background-size:118% 118%}}
.pc.shake{animation:mateShake .6s cubic-bezier(.36,.07,.19,.97) .28s both}
@keyframes mateShake{0%,100%{transform:rotate(0)}15%{transform:rotate(-9deg)}30%{transform:rotate(8deg)}45%{transform:rotate(-6deg)}60%{transform:rotate(4deg)}75%{transform:rotate(-2deg)}}
.badge.big{width:5.4%;height:5.4%;font:800 calc(var(--bs)/34)/1 var(--ui);color:#fff}
.badge.fresh{animation:pop .35s cubic-bezier(.3,1.6,.5,1) .35s both}
.mate-card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.85);z-index:8;background:rgba(38,36,33,.94);border-radius:10px;padding:18px 26px;text-align:center;
  box-shadow:0 10px 40px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .35s ease,transform .45s cubic-bezier(.3,1.5,.5,1)}
.mate-card.on{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto;cursor:pointer}
.mate-card .t{font-size:calc(var(--bs)/16);font-weight:800;letter-spacing:-.5px;color:#fff}
.mate-card .s{margin-top:4px;font-size:calc(var(--bs)/34);font-weight:700;color:var(--fg2)}
.mate-card .crown{width:calc(var(--bs)/9);height:calc(var(--bs)/9);margin:0 auto 8px;border-radius:50%;background:var(--green);display:grid;place-items:center;box-shadow:0 3px 0 var(--green-d)}
.mate-card .crown svg{width:62%;height:62%}
.sq.wrong::before{content:"";position:absolute;inset:0;background:rgba(250,65,45,.45)}
.sq.dot::after{content:"";position:absolute;left:50%;top:50%;width:30%;height:30%;transform:translate(-50%,-50%);border-radius:50%;background:rgba(0,0,0,.14)}
.sq.ring::after{content:"";position:absolute;inset:0;border-radius:50%;border:calc(var(--bs)/100) solid rgba(0,0,0,.14)}
.co{position:absolute;font-weight:700;font-size:calc(var(--bs)/52);line-height:1;pointer-events:none}
.co.r{left:4%;top:4%} .co.f{right:5%;bottom:4%}
.sq.l .co{color:var(--sq-d)} .sq.d .co{color:var(--sq-l)}
.pcs{position:absolute;inset:0;pointer-events:none}
.pc{position:absolute;width:12.5%;height:12.5%;background-size:100%;will-change:transform}
.pc.drag{z-index:5;transition:none!important}
.pc.ghost{opacity:.35}
.badge{position:absolute;width:4.6%;height:4.6%;border-radius:50%;z-index:6;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.45);pointer-events:none;animation:pop .2s ease-out}
.badge svg{width:70%;height:70%}
@keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}
.arrows{position:absolute;inset:0;pointer-events:none;z-index:4}
.promo-note{display:none}

/* Panel */
.panel{width:420px;flex:none;background:var(--panel);border-radius:6px;display:flex;flex-direction:column;height:calc(var(--bs) + 92px);max-height:calc(100vh - 32px);min-height:520px;overflow:hidden}
.tabs{display:flex;background:var(--panel2);flex:none}
.tab{flex:1;padding:12px 6px 10px;font-weight:700;font-size:13px;color:var(--fg3);display:flex;flex-direction:column;align-items:center;gap:4px;border-bottom:3px solid transparent}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--fg);background:var(--panel);border-bottom-color:transparent}
.tab:hover{color:var(--fg)}
.view{flex:1;min-height:0;display:flex;flex-direction:column}
.view[hidden]{display:none!important}

/* Library */
.filters{padding:12px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.seg{display:flex;background:var(--panel2);border-radius:5px;padding:3px;gap:3px}
.seg button{flex:1;padding:7px 4px;border-radius:4px;font-weight:700;font-size:13px;color:var(--fg3);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:#45423e;color:var(--fg)}
.seg img{width:18px;height:18px}
.search{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:0 10px}
.search svg{width:16px;height:16px;color:var(--fg3);flex:none}
.search input{flex:1;min-width:0;background:none;border:0;color:var(--fg);padding:9px 0;font:inherit;outline:none}
.list{flex:1;overflow:auto;padding-bottom:10px}
.grp{padding:12px 14px 6px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--fg3)}
.item{display:flex;align-items:center;gap:12px;padding:10px 14px;cursor:pointer;width:100%;text-align:left}
.item:hover{background:var(--rowh)}
.item.cur{background:#3f4a35}
.item .ic{width:34px;height:34px;border-radius:4px;flex:none;display:grid;place-items:center}
.item .ic.w{background:#e9e8e3} .item .ic.b{background:#1a1917;border:1px solid #4a4744}
.item .ic img{width:28px;height:28px}
.item .tx{flex:1;min-width:0}
.item .nm{font-weight:700;font-size:14px;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .pv{font-size:12px;color:var(--fg3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;font-variant-numeric:tabular-nums}
.item .eco{font-size:11px;font-weight:700;color:var(--fg3);background:var(--panel2);border-radius:3px;padding:2px 6px;flex:none}
.item .ok{width:20px;height:20px;flex:none;border-radius:50%;background:var(--green);display:grid;place-items:center}
.item .ok svg{width:12px;height:12px}
.item .ok.no{background:none;border:2px solid #4a4744}
.empty{padding:30px 16px;color:var(--fg3);text-align:center}
.famhead .chev{width:18px;height:18px;flex:none;color:var(--fg3);transition:transform .2s}
.fam.open .famhead .chev{transform:rotate(90deg)}
.fam .subs{display:none}
.fam.open .subs{display:block;background:#22211e;border-bottom:1px solid var(--line)}
.item.sub{padding:8px 14px 8px 22px;gap:10px}
.item.sub .nm{font-size:13px}
.tree{width:22px;height:22px;flex:none;border-left:2px solid #4a4744;border-bottom:2px solid #4a4744;border-bottom-left-radius:7px;margin:-14px 0 0 10px}
.maintag{font-size:10px;font-weight:800;background:#33402a;color:#c5e3a4;border-radius:3px;padding:1px 5px;margin-left:6px;vertical-align:1px}
.vars{display:flex;flex-wrap:wrap;gap:6px}
.vars button{font-size:12px;font-weight:700;padding:5px 10px;border-radius:14px;background:var(--panel2);color:var(--fg2);border:1px solid var(--line)}
.vars button:hover{color:var(--fg);border-color:#5b5855}
.vars button.on{background:#3f4a35;color:var(--fg);border-color:#5d7a3f}
.vars .ck{color:var(--green);margin-left:5px}

/* Line view */
.lhead{padding:14px 14px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.lhead h2{margin:0;font-size:18px;line-height:1.25;text-wrap:balance}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{font-size:11px;font-weight:700;padding:3px 7px;border-radius:3px;background:var(--panel2);color:var(--fg2)}
.chip.trap{background:#5c2b24;color:#ffb3a8}
.chip.op{background:#33402a;color:#c5e3a4}
.desc{font-size:13px;color:var(--fg2);line-height:1.5;margin:0}
.modes{display:flex;gap:6px}
.modes button{flex:1;padding:8px;border-radius:5px;font-weight:700;font-size:13px;background:var(--panel2);color:var(--fg3)}
.modes button.on{background:#45423e;color:var(--fg)}
.coach{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:flex-start;min-height:86px}
.coach .face{width:42px;height:42px;border-radius:50%;background:#3d3a36;flex:none;display:grid;place-items:center}
.coach .face svg{width:30px;height:30px}
.bubble{position:relative;background:#fff;color:#312e2b;border-radius:8px;padding:9px 12px;font-size:13.5px;line-height:1.45;flex:1;min-width:0}
.bubble::before{content:"";position:absolute;left:-7px;top:14px;border:7px solid transparent;border-left:0;border-right-color:#fff}
.bubble b{font-weight:800}
.bubble .mv{font-family:var(--mono);font-weight:700}
.bubble.good{box-shadow:inset 4px 0 0 var(--good)}
.bubble.bad{box-shadow:inset 4px 0 0 var(--bad)}
.bubble.book{box-shadow:inset 4px 0 0 var(--book)}
.moves{flex:1;overflow:auto;font-variant-numeric:tabular-nums}
.mrow{display:grid;grid-template-columns:44px 1fr 1fr;align-items:center;font-size:14px}
.mrow:nth-child(odd){background:var(--row)}
.mrow .n{color:var(--fg3);padding:6px 0 6px 14px;font-weight:600}
.mrow .m{padding:5px 8px;margin:1px 4px;border-radius:3px;font-weight:700;color:var(--fg2);cursor:pointer;display:flex;align-items:center;gap:5px}
.mrow .m:hover{background:#45423e}
.mrow .m.cur{background:#4b4847;color:var(--fg);border-bottom:2px solid #6b6866}
.mrow .m.off{font-style:italic;color:#d7a24a}
.mrow .m.hid{color:transparent;cursor:default;pointer-events:none}
.mrow .m.hid::after{content:"···";color:var(--fg3)}
.mrow .m .cdot{width:5px;height:5px;border-radius:50%;background:var(--book);flex:none}
.done{margin:12px 14px;padding:14px;border-radius:6px;background:#2f3b27;display:flex;flex-direction:column;gap:10px}
.done h3{margin:0;font-size:16px}
.done p{margin:0;color:var(--fg2);font-size:13px}
.ctrl{flex:none;display:flex;gap:4px;padding:8px 10px;background:var(--panel2)}
.ctrl button{flex:1;height:40px;border-radius:4px;background:#3c3a37;display:grid;place-items:center;color:var(--fg2)}
.ctrl button:hover{background:#4a4744;color:var(--fg)}
.ctrl button:disabled{opacity:.4;cursor:default}
.ctrl svg{width:20px;height:20px}
.actions{flex:none;display:flex;gap:8px;padding:10px 12px 12px;background:var(--panel2)}
.btn{flex:1;padding:12px 10px;border-radius:7px;font-weight:800;font-size:15px;background:#45423e;color:var(--fg);box-shadow:0 4px 0 #2b2926;transition:transform .05s}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #2b2926}
.btn.go{background:var(--green);box-shadow:0 4px 0 var(--green-d);text-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn.go:hover{background:var(--green-h)}
.btn.go:active{box-shadow:0 2px 0 var(--green-d)}
.credit{font-size:10.5px;color:#6f6d6a;padding:0 14px 8px;background:var(--panel2)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:#1c1b19;color:var(--fg);padding:10px 16px;border-radius:6px;font-weight:700;opacity:0;transition:.2s;pointer-events:none;z-index:50;box-shadow:0 4px 18px rgba(0,0,0,.4)}
.toast.on{opacity:1;transform:translateX(-50%)}

/* Phone / tablet */
@media (max-width:960px){
  body{overflow:auto}
  .app{flex-direction:column;height:auto;min-height:100%}
  .sidebar{width:auto;flex-direction:row;align-items:center;padding:6px max(10px,env(safe-area-inset-right,0px)) 6px max(10px,env(safe-area-inset-left,0px));overflow-x:auto;gap:0}
  .brand{padding:4px 10px 4px 0;font-size:16px}
  .brand svg{width:24px;height:24px}
  .nav{width:auto;padding:8px 10px;font-size:13px;gap:6px;white-space:nowrap}
  .nav svg{width:20px;height:20px}
  .nav .cnt{display:none}
  .side-foot{display:none}
  .main{flex-direction:column;align-items:stretch;padding-block:10px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:visible}
  .boardcol{--bs:min(calc(100vw - 32px),620px);margin:0 auto}
  .panel{width:100%;max-width:620px;margin:0 auto;height:auto;max-height:none;min-height:0}
  .list{max-height:60vh}
  .moves{max-height:240px}
  .clock{min-width:70px;font-size:14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <nav class="sidebar" aria-label="Main">
    <div class="brand">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="8" fill="#81b64c"/><path d="M20 7a4.2 4.2 0 0 0-2.6 7.5c-2 1.1-3.4 3.3-3.4 5.7 0 1.7.7 3.2 1.7 4.3-2.4 1-5 3.8-5 8.5h18.6c0-4.7-2.6-7.5-5-8.5a6.2 6.2 0 0 0 1.7-4.3c0-2.4-1.4-4.6-3.4-5.7A4.2 4.2 0 0 0 20 7z" fill="#fff"/></svg>
      <span>Opening<b>Lab</b></span>
    </div>
    <button class="nav on" data-nav="opening" id="nav-opening">
      <svg viewBox="0 0 24 24" fill="none" stroke="#81b64c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 5h7a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H2z"/><path d="M22 5h-7a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h8z"/></svg>
      Openings <span class="cnt" id="cnt-opening"></span></button>
    <button class="nav" data-nav="trap" id="nav-trap">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fa7b55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2l3 6 6 .9-4.5 4.3 1 6.3L12 16.6 6.5 19.5l1-6.3L3 8.9 9 8z"/></svg>
      Traps <span class="cnt" id="cnt-trap"></span></button>
    <button class="nav" data-nav="puzzle" id="nav-puzzle">
      <svg viewBox="0 0 24 24" fill="none" stroke="#f7c045" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h3.5a2.5 2.5 0 1 1 5 0H17v3.5a2.5 2.5 0 1 1 0 5V20H5v-3.5a2.5 2.5 0 1 0 0-5z"/></svg>
      Puzzles <span class="cnt" id="cnt-puzzle"></span></button>
    <button class="nav" data-nav="middlegame" id="nav-middlegame">
      <svg viewBox="0 0 24 24" fill="none" stroke="#c88cf0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4l10 10M4 4h4M4 4v4M20 4L10 14M20 4h-4M20 4v4M7 17l-3 3M17 17l3 3M12 12l-5 5 1 1M12 12l5 5-1 1"/></svg>
      Middlegame <span class="cnt" id="cnt-middlegame"></span></button>
    <button class="nav" data-nav="endgame" id="nav-endgame">
      <svg viewBox="0 0 24 24" fill="none" stroke="#e8e6e3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 21V4M6 4h11l-2.5 4L17 12H6"/></svg>
      Endgame <span class="cnt" id="cnt-endgame"></span></button>
    <button class="nav" data-nav="drill" id="nav-drill">
      <svg viewBox="0 0 24 24" fill="none" stroke="#5fa8e8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="#5fa8e8"/></svg>
      Random Drill</button>
    <div class="side-foot">
      <div class="prog"><span id="prog-txt">0 of 0 mastered</span><div class="bar"><i id="prog-bar"></i></div></div>
      <a class="dl" href="https://github.com/princepeniyel/opening-lab/releases/latest" target="_blank" rel="noopener">Download for Mac &amp; Windows</a>
      <label class="toggle"><input type="checkbox" id="opt-arrow" checked> Show next-move arrow</label>
      <label class="toggle"><input type="checkbox" id="opt-legal" checked> Show legal moves</label>
    </div>
  </nav>

  <main class="main">
    <section class="boardcol" aria-label="Board">
      <div class="player" id="p-top"></div>
      <div class="board" id="board">
        <div class="sqs" id="sqs"></div>
        <svg class="arrows" id="arrows" viewBox="0 0 8 8"></svg>
        <div class="pcs" id="pcs"></div>
        <div class="mate-card" id="mate-card" role="status"></div>
      </div>
      <div class="player" id="p-bot"></div>
    </section>

    <aside class="panel" aria-label="Study panel">
      <div class="tabs" role="tablist">
        <button class="tab on" data-tab="lib" id="tab-lib" role="tab">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Library</button>
        <button class="tab" data-tab="line" id="tab-line" role="tab">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>Study</button>
      </div>

      <div class="view" id="v-lib">
        <div class="filters">
          <div class="seg" id="f-side">

<script>
(function(){

const ICON={

  bad:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  mate:'<svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2l2.6 6.3 6.4.5-4.9 4.2 1.5 6.5L12 16l-5.6 3.5 1.5-6.5L3 8.8l6.4-.5z"/></svg>',
  crown:'<svg viewBox="0 0 24 24" fill="#fff"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 10H5z"/><rect x="5" y="19" width="14" height="2.2" rx="1"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'
};
const BCOL={book:'var(--book)',good:'var(--good)',bad:'var(--bad)',mate:'#e6912c'};

// ---------- data ----------
function parsePgn(p){const out=[];const re=/\{([^}]*)\}|(\S+)/g;let m;while((m=re.exec(p))){if(m[1]!==undefined){if(out.length)out[out.length-1].c=m[1].trim();}else out.push({san:m[2]});}return out;}
LINES.filter(L=>L.type==='opening').forEach(P=>{const ci=P.name.indexOf(':');P.base=ci>0?P.name.slice(0,ci):P.name;P.varName=ci>0?P.name.slice(ci+1).trim():'Main line';P.kids=[];
  (VARIATIONS[P.id]||[]).forEach((v,k)=>{const C={id:P.id+'-v'+(k+1),type:'opening',side:P.side,eco:v.eco||P.eco,family:P.family,parent:P.id,base:P.base,varName:v.name,
    name:P.base+': '+v.name,desc:v.desc||('A key line of the '+P.base+'. The notes on each move explain the plans.'),pgn:v.pgn};P.kids.push(C.id);LINES.push(C);});});
{const cnt={};LINES.filter(L=>L.type==='opening'&&!L.parent).forEach(L=>cnt[L.base]=(cnt[L.base]||0)+1);
  LINES.filter(L=>L.type==='opening'&&!L.parent&&cnt[L.base]>1).forEach(P=>{P.head=P.name;});}
LINES.forEach(L=>{if(!L.pgn)return;const pm=parsePgn(L.pgn);L.book=pm.map(x=>x.san);L.notes=pm.map(x=>x.c||'');
  let s='';L.book.slice(0,8).forEach((m,i)=>{s+=(i%2?'':((i/2+1)+'.'))+m+' ';});L.preview=s.trim()+(L.book.length>8?' …':'');});
const SHORT={'Mate in 1':'M1','Mate in 2':'M2','Opening trap':'Trap'};
const countPiece=(fen,ch)=>fen.split(' ')[0].split('').filter(c=>c===ch).length;
function addFixed(arr,type){arr.forEach(p=>{const g=new Chess(p.fen);const pm=parsePgn(p.pgn);const side=g.turn();
  LINES.push(Object.assign({},p,{type,side,book:pm.map(x=>x.san),notes:pm.map(x=>x.c||''),eco:SHORT[p.theme]||p.theme,family:p.theme,
    preview:(side==='w'?'White':'Black')+' to move · '+p.theme}));});}
addFixed(PUZZLES,'puzzle');
Object.entries(TRAP_PUZZLES).forEach(([id,k])=>{const T=LINES.find(x=>x.id===id);const g=new Chess();for(let i=0;i<k;i++)g.move(T.book[i]);const side=g.turn();
  LINES.push({id:'pz-'+id,type:'puzzle',theme:'Opening trap',family:'Opening trap',eco:'Trap',name:T.name,fen:g.fen(),side,book:T.book.slice(k),notes:T.notes.slice(k),
    desc:'From the '+T.name+'. Find the winning idea.',preview:(side==='w'?'White':'Black')+' to move · from the '+T.name});});
addFixed(MIDDLEGAME,'middlegame');
const GOALTXT={mate:'Checkmate',promote:'Make a queen',capture:'Stop the pawn'};
ENDGAME.forEach(p=>{const side=new Chess(p.fen).turn();LINES.push(Object.assign({},p,{type:'endgame',side,book:[],notes:[],eco:p.theme.split(' ')[0],family:p.theme,
  q0:countPiece(p.fen,side==='w'?'Q':'q'),preview:(side==='w'?'White':'Black')+' · '+GOALTXT[p.goal]+' in '+p.limit+' moves'}));});
const PUZZLY=t=>t==='puzzle'||t==='middlegame';
const byId=Object.fromEntries(LINES.map(L=>[L.id,L]));

// ---------- storage ----------
const store={get(k,d){try{const v=localStorage.getItem('ol.'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem('ol.'+k,JSON.stringify(v));}catch(e){}}};
let mastered=store.get('mastered',{});
const opts={arrow:store.get('arrow',true),legal:store.get('legal',true)};

// ---------- state ----------
const S={cat:'opening',side:'all',q:'',line:null,moves:[],ply:0,mode:'study',orient:'w',sel:null,
  pr:{mistakes:0,done:false,busy:false,hint:false,wrong:null,result:null},badge:null,tab:'lib'};
let cur=new Chess();

function chessAt(ply){const g=new Chess(S.line&&S.line.fen?S.line.fen:undefined);let last=null;for(let i=0;i<ply;i++){last=g.move(S.moves[i]);}return{g,last};}
function divergence(){if(!S.line)return 0;let i=0;while(i<S.moves.length&&S.moves[i]===S.line.book[i])i++;return i;}

// ---------- sound ----------
// Sound is turned off: these are kept as no-ops so game logic stays unchanged.
function snd(){}
function moveSound(){}

// ---------- board ----------
const FILES='abcdefgh';const ANIM=260;
function sqXY(sq){const f=FILES.indexOf(sq[0]),r=+sq[1]-1;return S.orient==='w'?{x:f,y:7-r}:{x:7-f,y:r};}
function xySq(x,y){return S.orient==='w'?FILES[x]+(8-y):FILES[7-x]+(y+1);}
function buildSquares(){const el=$('sqs');el.innerHTML='';for(let y=0;y<8;y++)for(let x=0;x<8;x++){const sq=xySq(x,y);const f=FILES.indexOf(sq[0]),r=+sq[1];
  const d=document.createElement('div');d.className='sq '+(((f+r)%2===0)?'l':'d');d.dataset.sq=sq;d.id='sq-'+sq;
  if(x===0){const c=document.createElement('span');c.className='co r';c.textContent=r;d.appendChild(c);}
  if(y===7){const c=document.createElement('span');c.className='co f';c.textContent=sq[0];d.appendChild(c);}
  el.appendChild(d);}
  // ((f+r)%2===0) → a1 (0+1)=odd → dark; fix parity
  el.querySelectorAll('.sq').forEach(d=>{const sq=d.dataset.sq;const dark=(FILES.indexOf(sq[0])+(+sq[1]))%2===1;d.classList.toggle('d',dark);d.classList.toggle('l',!dark);});
}
function render(anim){
  const {g,last}=chessAt(S.ply);cur=g;
  document.querySelectorAll('.sq').forEach(d=>d.classList.remove('hl','sel','chk','dot','ring','wrong'));
  if(S.pr.wrong){[S.pr.wrong.from,S.pr.wrong.to].forEach(s=>$('sq-'+s).classList.add('wrong'));}
  else if(last){$('sq-'+last.from).classList.add('hl');$('sq-'+last.to).classList.add('hl');}
  if(g.in_check()){const b=g.board();for(let r=0;r<8;r++)for(let f=0;f<8;f++){const p=b[r][f];if(p&&p.type==='k'&&p.color===g.turn())$('sq-'+FILES[f]+(8-r)).classList.add('chk');}}
  if(S.sel){$('sq-'+S.sel).classList.add('sel');if(opts.legal)g.moves({square:S.sel,verbose:true}).forEach(m=>$('sq-'+m.to).classList.add(m.captured?'ring':'dot'));}
  // pieces
  const pcs=$('pcs');pcs.innerHTML='';const b=g.board();const wrongG=S.pr.wrong?S.pr.wrong.g:null;const bb=wrongG?wrongG.board():b;

function go(ply,anim){if(!S.line||S.mode==='practice')return;ply=Math.max(0,Math.min(S.moves.length,ply));const fwd=ply===S.ply+1;S.ply=ply;S.sel=null;
  const {g,last}=chessAt(ply);S.badge=last&&ply<=divergence()?{sq:last.to,kind:g.in_checkmate()?'mate':'book'}:null;render(fwd&&anim!==false);if(fwd)moveSound(last,g);}
function maybeOpponent(){if(S.mode!=='practice'||S.pr.result)return;const L=S.line;
  if(S.ply>=L.book.length){finishPractice();return;}
  if(cur.turn()!==L.side){S.pr.busy=true;setTimeout(()=>{if(S.mode!=='practice'||S.line!==L)return;S.ply++;S.pr.busy=false;const {g,last}=chessAt(S.ply);S.badge=null;render(true);moveSound(last,g);
      if(S.ply>=L.book.length)finishPractice();},520);}
}
function finishPractice(){S.pr.result=true;if(S.pr.mistakes===0){mastered[S.line.id]=Date.now();store.set('mastered',mastered);}renderProgress();renderList();
  setMeta();if(!cur.in_checkmate())snd('end');toast(PUZZLY(S.line.type)?'Solved!':S.pr.mistakes?'Line complete':'Mastered!');render();}

function tryMove(from,to,dragged){if(!S.line){return false;}const an=dragged?undefined:true;
  const g=new Chess(cur.fen());const cands=g.moves({verbose:true}).filter(m=>m.from===from&&m.to===to);if(!cands.length)return false;
  let pick=cands[0];
  if(cands.length>1){const want=S.ply<S.line.book.length?S.line.book[S.ply]:null;pick=cands.find(c=>c.san===want)||cands.find(c=>c.promotion==='q')||cands[0];}
  const san=pick.san;
  if(S.mode==='practice'&&S.line.type==='endgame'){if(S.pr.busy||S.pr.result||cur.turn()!==S.line.side)return false;
    S.moves=S.moves.slice(0,S.ply).concat(san);S.ply++;S.badge=null;const {g:g2,last}=chessAt(S.ply);render(an);moveSound(last,g2);
    if(!egCheck())egReply();return true;}
  if(S.mode==='practice'){
    if(!S.pr.busy&&!S.pr.result&&san!==S.line.book[S.ply]&&S.ply===S.line.book.length-1){const t=new Chess(cur.fen());t.move(san);if(t.in_checkmate())S.moves[S.ply]=san;}
    const okMove=san===S.moves[S.ply];
    if(S.pr.busy||S.pr.result||cur.turn()!==S.line.side)return false;
    if(okMove){S.ply++;S.pr.hint=false;S.pr.lastGood=true;const {g:g2,last}=chessAt(S.ply);S.badge={sq:last.to,kind:g2.in_checkmate()?'mate':'good'};render(an);moveSound(last,g2);
      if(S.ply>=S.line.book.length)finishPractice();else maybeOpponent();}
    else{S.pr.mistakes++;S.pr.lastGood=false;const wg=new Chess(cur.fen());wg.move(san);S.pr.wrong={from,to,san,g:wg};S.badge={sq:to,kind:'bad'};S.pr.busy=true;render();snd('bad');
      setTimeout(()=>{S.pr.wrong=null;S.badge=null;S.pr.busy=false;render();},850);}
    return true;}
  // study / explore
  if(S.busy||cur.turn()!==S.line.side)return false;
  if(S.moves[S.ply]===san){go(S.ply+1,!dragged);studyReply();return true;}
  S.moves=S.moves.slice(0,S.ply).concat(san);S.ply++;const {g:g2,last}=chessAt(S.ply);S.badge=S.ply<=divergence()?{sq:last.to,kind:'book'}:null;render(an);moveSound(last,g2);studyReply();return true;}

// ---------- input (drag & click) ----------
const board=$('board');let drag=null;
function sqFromPoint(cx,cy){const r=board.getBoundingClientRect();const x=Math.floor((cx-r.left)/r.width*8),y=Math.floor((cy-r.top)/r.height*8);if(x<0||y<0||x>7||y>7)return null;return xySq(x,y);}
function canPick(sq){if(!S.line||S.busy||cur.turn()!==S.line.side)return false;if(S.mode==='practice'&&(S.pr.busy||S.pr.result))return false;const p=cur.get(sq);return p&&p.color===cur.turn();}
function snapBack(d){const {x,y}=sqXY(d.sq);const e=d.el;S.sel=null;e.classList.remove('drag');e.style.zIndex=5;
  e.style.transition='left .22s cubic-bezier(.25,.75,.3,1), top .22s cubic-bezier(.25,.75,.3,1)';e.style.left=(x*12.5)+'%';e.style.top=(y*12.5)+'%';
  setTimeout(()=>{if(!drag)render();},230);}
function cancelDrag(){if(!drag)return;const d=drag;drag=null;if(d.moved)snapBack(d);else{S.sel=null;render();}}
board.addEventListener('contextmenu',e=>e.preventDefault());
$('mate-card').addEventListener('pointerdown',e=>{e.stopPropagation();$('mate-card').classList.remove('on');});
board.addEventListener('pointerdown',e=>{if(drag&&e.button!==0){cancelDrag();return;}if(e.button!==0){if(S.sel){S.sel=null;render();}return;}const sq=sqFromPoint(e.clientX,e.clientY);if(!sq)return;
  if(S.sel&&S.sel!==sq){const ok=tryMove(S.sel,sq,false);if(ok){S.sel=null;return;}}
  if(!canPick(sq)){if(S.sel){S.sel=null;render();}return;}
  e.preventDefault();S.sel=sq;render();const el=$('pcs').querySelector('.pc[data-sq="'+sq+'"]');if(!el)return;
  const r=board.getBoundingClientRect();drag={sq,el,r,moved:false,sx:e.clientX,sy:e.clientY};el.classList.add('drag');board.setPointerCapture(e.pointerId);});
board.addEventListener('pointermove',e=>{if(!drag)return;if(e.buttons&2){cancelDrag();return;}const {el,r}=drag;if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>3)drag.moved=true;if(!drag.moved)return;
  const s=r.width/8;el.style.left=(e.clientX-r.left-s/2)/r.width*100+'%';el.style.top=(e.clientY-r.top-s/2)/r.height*100+'%';});
board.addEventListener('pointerup',e=>{if(!drag||e.button!==0)return;const d=drag;drag=null;const to=sqFromPoint(e.clientX,e.clientY);
  if(d.moved&&to&&to!==d.sq){if(tryMove(d.sq,to,true)){S.sel=null;return;}}
  if(d.moved){if(to===d.sq){render();}else snapBack(d);}});
board.addEventListener('pointercancel',()=>{cancelDrag();});

// ---------- buttons ----------
$('b-first').onclick=()=>go(0);$('b-prev').onclick=()=>go(S.ply-1);$('b-next').onclick=()=>go(S.ply+1);$('b-last').onclick=()=>go(S.moves.length);
$('b-flip').onclick=()=>{S.orient=S.orient==='w'?'b':'w';buildSquares();render();};
$('m-study').onclick=()=>S.line&&setMode('study');$('m-practice').onclick=()=>S.line&&setMode('practice');
$('a-left').onclick=()=>{if(!S.line){drill();return;}
  if(S.mode==='practice'&&S.line.type==='endgame'){if(S.pr.busy||!S.ply)return;const n=cur.turn()===S.line.side?2:1;S.moves=S.moves.slice(0,Math.max(0,S.ply-n));S.ply=S.moves.length;S.pr.result=null;S.badge=null;render();return;}
  if(S.mode==='practice'){S.pr.hint=!S.pr.hint;render();return;}
  if(S.ply>divergence()){S.moves=S.line.book.slice();go(divergence());}else{S.moves=S.line.book.slice();go(0);}studyReply();};
$('a-right').onclick=()=>{if(!S.line){const first=LINES.find(L=>L.type===S.cat&&(S.side==='all'||L.side===S.side));if(first)openLine(first.id);return;}
  if(S.mode==='practice'){if(S.pr.result==='win'||(S.pr.result&&S.line.type!=='endgame'))nextLine();else setMode('practice');}else setMode('practice');};
function nextLine(){const t=S.line.type;const pool=LINES.filter(L=>L.type===t&&(t==='opening'||t==='trap'?L.side===S.line.side:(S.side==='all'||L.side===S.side||L===S.line)));const i=pool.indexOf(S.line);openLine(pool[(i+1)%pool.length].id,'practice');}
function drill(){const pool=LINES.filter(L=>(S.side==='all'||L.side===S.side));const fresh=pool.filter(L=>!mastered[L.id]);const from=fresh.length?fresh:pool;const L=from[Math.floor(Math.random()*from.length)];openLine(L.id,'practice');toast('Drill: '+L.name);}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{if(t.dataset.tab==='line'&&!S.line){toast('Pick a line from the library first');return;}setTab(t.dataset.tab);});
document.querySelectorAll('.nav[data-nav]').forEach(n=>n.onclick=()=>{const v=n.dataset.nav;if(v==='drill'){drill();return;}
  S.cat=v;document.querySelectorAll('.nav[data-nav]').forEach(x=>x.classList.toggle('on',x===n));setTab('lib');renderList();});
$('f-side').querySelectorAll('button').forEach(b=>b.onclick=()=>{S.side=b.dataset.side;$('f-side').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));renderList();});
$('f-q').addEventListener('input',e=>{S.q=e.target.value;renderList();});
$('list').addEventListener('click',e=>{const fh=e.target.closest('[data-exp]');if(fh){const id=fh.dataset.exp;const fam=fh.parentNode;EXP[id]=!fam.classList.contains('open');renderList();return;}
  const it=e.target.closest('.item');if(it)openLine(it.dataset.id);});
$('l-vars').addEventListener('click',e=>{const b=e.target.closest('[data-var]');if(b&&b.dataset.var!==S.line.id)openLine(b.dataset.var,S.mode==='practice'?'practice':undefined);});
$('moves').addEventListener('click',e=>{const m=e.target.closest('.m');if(m&&S.mode==='study')go(+m.dataset.ply,false);});
[['opt-arrow','arrow'],['opt-legal','legal']].forEach(([id,k])=>{const el=$(id);el.checked=opts[k];el.onchange=()=>{opts[k]=el.checked;store.set(k,el.checked);render();};});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&drag){cancelDrag();return;}if(e.target.tagName==='INPUT')return;
  if(e.key==='ArrowLeft'){go(S.ply-1);e.preventDefault();}else if(e.key==='ArrowRight'){go(S.ply+1);e.preventDefault();}
  else if(e.key==='ArrowUp'||e.key==='Home'){go(0);e.preventDefault();}else if(e.key==='ArrowDown'||e.key==='End'){go(S.moves.length);e.preventDefault();}
  else if(e.key==='f'){$('b-flip').click();}});
let tt;function toast(t){const el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('on'),1600);}

// ---------- boot ----------
$('ic-w').src=PIECES.wp;$('ic-b').src=PIECES.bp;
buildSquares();renderProgress();renderList();
const h=(location.hash||'').slice(1);
if(byId[h])openLine(h);else{openLine('italian');setTab('lib');}
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(byId[id]&&(!S.line||S.line.id!==id))openLine(id);});
})();
</script>
